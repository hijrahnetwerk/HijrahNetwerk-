<style>
:root{
  --brown:#684a25;--brown-dark:#4d3819;--orange:#df842c;--gold:#e9a74b;
  --cream:#faf8f5;--text:#2c2722;--muted:#786f66;--border:#e8e1d8;
  --soft:#f5efe8;--white:#fff;--green:#2f7650;--green-bg:#edf6f0;
  --shadow:0 4px 18px rgba(77,56,25,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,sans-serif;line-height:1.55}
a{text-decoration:none;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--border)}

.navlinks a{padding:8px 10px;border-radius:8px;color:var(--brown);font-size:14px}

.badge.green{background:var(--green-bg);color:var(--green)}

.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:end}
h1{font-size:clamp(30px,4vw,42px);line-height:1.1;color:var(--brown-dark);margin:0 0 9px}
.summary{font-size:17px;color:var(--muted);max-width:820px;margin:0}
.location{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;margin-top:14px}
.hero-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

.primary{background:var(--orange);color:#fff}

<body>
<link rel="stylesheet" href="assets/public-nav.css">

<main class="wrap">
  <a class="back" href="/navigatie">← Terug naar Hijrah Navigatie</a>
  <div id="app"><div class="empty">Fiche wordt geladen...</div></div>
</main>

<script>
const db=()=>window.hijrahSupabase;
const esc=v=>v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const data=x=>x&&x.card_data&&typeof x.card_data==='object'?x.card_data:{};
const params=new URLSearchParams(location.search),legacyId=params.get('id'),routeSlug=location.pathname.match(/^\/fiche\/([^/]+)\/?$/)?.[1]||params.get('slug')||'';

const icon={
  pin:'<span class="icon"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12A7 7 0 1 0 5 9c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/></svg></span>',
  phone:'<span class="icon"><svg viewBox="0 0 24 24"><path d="M6.6 3.5 9.1 7 7.3 9.2c1.1 2.3 2.9 4.1 5.2 5.2l2.2-1.8 3.5 2.5c.6.4.8 1.2.5 1.8l-.9 1.7c-.3.6-1 .9-1.7.8C9.6 18.3 5.7 14.4 4.6 8c-.1-.7.2-1.4.8-1.7l1.7-.9c.3-.2.6-.2.9.1Z"/></svg></span>',
  web:'<span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></span>',
  map:'<span class="icon"><svg viewBox="0 0 24 24"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg></span>'
};

function formatContent(value,summary){
  const raw=value==null?'':String(value);
  const text=raw
    .replace(/\\r/g,'')
    .replace(/\\n/g,'\n')
    .replace(/\r/g,'')
    .trim();

  if(!text)return '';

  const duplicateSections=new Set([
    'consultaties',
    'afspraken',
    'huisbezoeken',
    'teleconsultatie',
    'belangrijk'
  ]);

  const summaryClean=String(summary||'')
    .replace(/\\r/g,'')
    .replace(/\\n/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();

  const headingPattern=/^(Opleiding en professionele achtergrond|Over het cabinet|Consultaties|Afspraken|Huisbezoeken|Teleconsultatie|Belangrijk)$/i;
  const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);

  const sections=[];
  let heading='';
  let body=[];

  const pushSection=()=>{
    if(heading||body.length){
      sections.push({heading,body:[...body]});
    }
    heading='';
    body=[];
  };

  lines.forEach(line=>{
    if(headingPattern.test(line)){
      pushSection();
      heading=line;
    }else{
      body.push(line);
    }
  });
  pushSection();

  let out='';

  sections.forEach(section=>{
    const headingClean=section.heading.trim().toLowerCase();
    if(duplicateSections.has(headingClean))return;

    const parts=[];
    let bullets=[];

    const flushBullets=()=>{
      if(!bullets.length)return;
      parts.push('<ul>'+bullets.map(x=>'<li>'+esc(x.replace(/^•\s*/,''))+'</li>').join('')+'</ul>');
      bullets=[];
    };

    section.body.forEach(line=>{
      if(/^•\s*/.test(line)){
        bullets.push(line);
      }else{
        flushBullets();
        const clean=line.replace(/\s+/g,' ').trim();
        if(clean)parts.push('<p>'+esc(clean)+'</p>');
      }
    });
    flushBullets();

    const combinedText=section.body
      .filter(x=>!/^•\s*/.test(x))
      .join(' ')
      .replace(/\s+/g,' ')
      .trim()
      .toLowerCase();

    const onlySummary=summaryClean && combinedText===summaryClean && !section.heading;
    if(onlySummary)return;

    if(!parts.length)return;

    if(section.heading){
      out+='<h3>'+esc(section.heading)+'</h3>';
    }
    out+=parts.join('');
  });

  return out;
}

function item(label,value,html){
  if(value==null || String(value).trim()==='')return '';
  return '<div class="info-item"><div class="info-label">'+esc(label)+'</div><div class="info-value">'+(html||esc(value))+'</div></div>';
}

function telHref(value){
  return value?'tel:'+String(value).replace(/[^+\d]/g,''):'';
}

function mapsHref(d,pageTitle,loc){
  if(d.maps_url)return d.maps_url;
  const query=[d.address||'',loc||''].filter(Boolean).join(', ');
  return query?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query):'';
}

async function init(){
  if(!legacyId && !routeSlug){
    document.getElementById('app').innerHTML='<div class="error">Geen fiche geselecteerd.</div>';
    return;
  }

  let topicQuery=db().from('topic').select('id,title,slug,summary,content,information_type,country_id,city_id,category_id,published,visibility,card_data,source,source_url,updated_at,last_checked_at,next_review_at,verified_at,submitted_by').eq('published',true);

  if(routeSlug){
    topicQuery=topicQuery.eq('slug',decodeURIComponent(routeSlug));
  }else{
    topicQuery=topicQuery.eq('id',legacyId);
  }

  const [r,c,ci,ca]=await Promise.all([
    topicQuery.maybeSingle(),
    db().from('countries').select('id,name').order('name'),
    db().from('cities').select('id,name').order('name'),
    db().from('categories').select('id,name').order('name')
  ]);

  if(r.error||!r.data){
    document.getElementById('app').innerHTML='<div class="error">Deze fiche is niet beschikbaar of kon niet worden geladen.</div>';
    return;
  }

  const x=r.data,d=data(x);
  const id=x.id;
  const ficheSlug=x.slug||id;
  const country=(c.data||[]).find(y=>y.id===x.country_id)?.name||'';
  const city=(ci.data||[]).find(y=>y.id===x.city_id)?.name||'';
  const cat=(ca.data||[]).find(y=>y.id===x.category_id)?.name||'';
  const loc=[city,country].filter(Boolean).join(', ');
  const exps=Array.isArray(d.experiences)?d.experiences:[];
  const infoType=x.information_type||'Praktische informatie';
  const verified=x.verified_at||x.last_checked_at;
  const pageTitle=x.title||'Hijrah Netwerk';

  document.title=pageTitle;
  const mapsUrl=mapsHref(d,pageTitle,loc);

  const seoDescription=(x.summary||d.short_description||('Praktische informatie over '+pageTitle+(loc?' in '+loc:''))) .replace(/\s+/g,' ').trim();
  const canonicalUrl='https://hijrah-netwerk.vercel.app/fiche/'+encodeURIComponent(ficheSlug);
  const setMeta=(selector,attribute,value)=>{
    const el=document.querySelector(selector);
    if(el)el.setAttribute(attribute,value);
  };
  setMeta('meta[name="description"]','content',seoDescription);
  setMeta('meta[property="og:title"]','content',pageTitle);
  setMeta('meta[property="og:description"]','content',seoDescription);
  setMeta('meta[property="og:url"]','content',canonicalUrl);
  setMeta('meta[name="twitter:title"]','content',pageTitle);
  setMeta('meta[name="twitter:description"]','content',seoDescription);

  const canonical=document.querySelector('link[rel="canonical"]');
  if(canonical)canonical.href=canonicalUrl;

  const structuredData={
    "@context":"https://schema.org",
    "@type":"Physician",
    "@id":canonicalUrl+"#physician",
    "name":String(d.doctor_name||d.full_name||pageTitle).replace(/\s*\|.*$/,"").replace(/^Dr\.\s*/,"").trim(),
    "url":canonicalUrl,
    "description":seoDescription,
    "medicalSpecialty":"GeneralPractice"
  };
  if(d.phone)structuredData.telephone=d.phone;
  if(d.email)structuredData.email=d.email;
  if(d.website)structuredData.sameAs=[d.website];
  if(d.address){
    structuredData.address={
      "@type":"PostalAddress",
      "streetAddress":d.address,
      ...(loc?{"addressLocality":city||loc}:{}),
      ...(country?{"addressCountry":country}:{})
    };
  }
  if(mapsUrl)structuredData.hasMap=mapsUrl;
  if(d.for_children)structuredData.description=seoDescription+' '+String(d.for_children);
  const schemaEl=document.getElementById('structured-data');
  if(schemaEl)schemaEl.textContent=JSON.stringify(structuredData);

  let html='';

  html+='<section class="hero">';
  html+='<div class="badges"><span class="badge">'+esc(cat||'Hijrah Navigatie')+'</span>';
  html+=verified?'<span class="badge green">✓ Geverifieerde informatie</span>':'<span class="badge gray">Niet geverifieerd</span>';
  html+='</div>';
  html+='<div class="hero-grid"><div>';
  html+='<h1>'+esc(pageTitle)+'</h1>';
  if(x.summary||d.short_description)html+='<p class="summary">'+esc(x.summary||d.short_description)+'</p>';
  if(loc)html+='<div class="location">'+icon.pin+esc(loc)+'</div>';
  html+='<div class="hero-actions">';
  if(d.phone)html+='<a class="button primary" href="'+esc(telHref(d.phone))+'">'+icon.phone+'Bel</a>';
  if(mapsUrl)html+='<a class="button secondary" target="_blank" rel="noopener" href="'+esc(mapsUrl)+'">'+icon.map+'Google Maps</a>';
  if(d.website)html+='<a class="button outline" target="_blank" rel="noopener" href="'+esc(d.website)+'">'+icon.web+'Website</a>';
  html+='<a class="button primary" href="bijdragen.html?type=experience&title='+encodeURIComponent(pageTitle)+'">Ervaring delen</a>';
  html+='</div>';
  html+='</div></div></section>';

  html+='<div class="layout">';

  html+='<div class="main">';

  if(x.content){

  html+='</aside></div>';

  html+='<section class="card" style="margin-top:18px"><h2>Informatie corrigeren</h2><p class="empty-note">Zie je iets dat niet klopt of verouderd is? Stuur de correctie naar HN. Niets wordt automatisch aangepast.</p><div class="hero-actions"><a class="button secondary" href="bijdragen.html?type=correction&title='+encodeURIComponent(pageTitle)+'">Correctie insturen</a></div></section>';

  document.getElementById('app').innerHTML=html;

init();

<script>
function toggleMobileNav(open){
  var nav=document.getElementById('mobileNav');
  var button=document.querySelector('.mobile-menu-toggle');
  if(!nav)return;
  if(open){
    nav.classList.add('open');
    nav.setAttribute('aria-hidden','false');
    if(button)button.setAttribute('aria-expanded','true');
    document.body.style.overflow='hidden';
  }else{
    nav.classList.remove('open');
    nav.setAttribute('aria-hidden','true');
    if(button)button.setAttribute('aria-expanded','false');
    document.body.style.overflow='';
  }
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')toggleMobileNav(false);
});
</script>
