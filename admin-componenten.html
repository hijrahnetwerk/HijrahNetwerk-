<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HN Componenten & Templates</title><script src="/assets/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><style>:root{--brown:#674C2E;--orange:#DD842A;--gold:#C6A15B}*{box-sizing:border-box}body{margin:0;background:#f7f4f0;color:var(--brown);font:15px Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.top a{color:var(--orange)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;border:1px solid #e2d9cf;border-radius:14px;padding:20px}.panel h2{margin:0 0 14px}.item{border-top:1px solid #eee;padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.item:first-child{border-top:0}.muted{color:#756d63;font-size:12px}.badge{display:inline-block;padding:4px 7px;border-radius:20px;background:#f4eadf;font-size:11px}.row{display:flex;gap:8px;align-items:center}.btn{border:1px solid #d9cdbf;background:#fff;color:var(--brown);padding:8px 11px;border-radius:8px;cursor:pointer}.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}.btn.danger{color:#a33}.message{margin-bottom:18px;padding:12px;border-radius:8px;background:#fff3e7;display:none}.message.show{display:block}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
<link rel="stylesheet" href="/assets/hn-sitewide.css?v=1">
<script src="/assets/hn-footer.js?v=1" defer></script>
<script src="/assets/hn-motion.js?v=1" defer></script>
</head><body><main class="wrap"><div class="top"><div><a href="/admin">← Admin</a><h1>HN Componenten & Templates</h1><p class="muted">Centraal beheer van de bouwstenen waarmee HN-pagina's worden opgebouwd.</p></div><a class="btn primary" href="/admin-builder">Pagina-bouwer openen</a></div><div id="msg" class="message"></div><div class="grid"><section class="panel"><h2>Componenten</h2><div id="components">Laden...</div></section><section class="panel"><h2>Pagina-templates</h2><div id="templates">Laden...</div><div style="margin-top:15px"><button class="btn" id="newTemplate">Template toevoegen</button></div></section></div></main><script>
(()=>{const db=()=>window.hijrahSupabase,$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t){$('msg').textContent=t;$('msg').classList.add('show');setTimeout(()=>$('msg').classList.remove('show'),3000)}
async function auth(){const s=await db().auth.getSession();if(!s.data.session){location='/login?next=/admin-componenten';return false}const r=await db().from('profiles').select('role').eq('id',s.data.session.user.id).maybeSingle();if(r.data?.role!=='admin'){document.body.innerHTML='<h1 style="padding:40px">Geen toegang</h1>';return false}return true}
async function load(){const c=await db().from('hn_component_definitions').select('*').order('sort_order');$('components').innerHTML=(c.data||[]).map(x=>'<div class="item"><div><b>'+esc(x.label)+'</b> <span class="badge">'+esc(x.group_name)+'</span><div class="muted">'+esc(x.description||'')+'</div><div class="muted">'+esc(x.component_type)+' · '+(x.is_active?'Actief':'Uitgeschakeld')+'</div></div><div class="row"><button class="btn" data-toggle="'+x.id+'">'+(x.is_active?'Uitschakelen':'Activeren')+'</button></div></div>').join('')||'<p class="muted">Geen componenten.</p>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const id=b.dataset.toggle;const old=(c.data||[]).find(x=>x.id===id);const r=await db().from('hn_component_definitions').update({is_active:!old.is_active}).eq('id',id);if(r.error)return msg(r.error.message);await load();msg('Componentstatus bijgewerkt.')});
const t=await db().from('hn_page_templates').select('*').order('name');$('templates').innerHTML=(t.data||[]).map(x=>'<div class="item"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.description||'')+'</div><div class="muted">'+esc(x.slug)+' · '+(x.is_active?'Actief':'Uitgeschakeld')+'</div></div><div><button class="btn" data-t="'+x.id+'">'+(x.is_active?'Uitschakelen':'Activeren')+'</button></div></div>').join('')||'<p class="muted">Geen templates.</p>';document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{const id=b.dataset.t;const old=(t.data||[]).find(x=>x.id===id);const r=await db().from('hn_page_templates').update({is_active:!old.is_active}).eq('id',id);if(r.error)return msg(r.error.message);await load();msg('Templatestatus bijgewerkt.')})}
$('newTemplate').onclick=async()=>{const name=prompt('Naam van template');if(!name)return;const structure=prompt('Componenten, komma-gescheiden (bijv. hero,intro,text)','hero,intro,text');const slug=String(name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');const r=await db().from('hn_page_templates').insert({name,slug,description:'HN-paginatemplate',structure:{sections:String(structure||'').split(',').filter(Boolean).map(component_type=>({component_type}))}});if(r.error)return msg(r.error.message);await load();msg('Template toegevoegd.')};
auth().then(ok=>ok&&load())})();</script></body></html>
