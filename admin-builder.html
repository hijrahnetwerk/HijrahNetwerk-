<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HN Pagina-bouwer</title><link rel="stylesheet" href="/assets/fonts.css"><link rel="stylesheet" href="/assets/platform-pages.css"><link rel="stylesheet" href="/assets/admin-builder.css"><script src="/assets/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><script src="/auth.js"></script><script src="/assets/admin-builder.js" defer></script></head><body><main class="builder"><header><div><a href="/admin">← Admin</a><h1>HN Pagina-bouwer</h1><p>Beheer de echte openbare pagina. De pagina zelf blijft intact; HN legt alleen wijzigingen over de bestaande pagina heen.</p></div><div><button id="save">Opslaan</button><button id="publish" class="primary">Publiceren</button></div></header><div id="msg" hidden></div><div class="layout"><aside class="side"><b>Blokken</b><small>Nieuwe CMS-blokken voor nieuwe pagina's.</small><div id="palette"></div><hr><b>Pagina's</b><button id="new">+ Nieuwe pagina</button><div id="pages"></div></aside><section class="work"><nav><strong id="heading">Pagina</strong><span id="route"></span><div><button id="liveBtn" class="active">Live pagina</button><button id="blocksBtn">CMS-blokken</button><button id="desktop" class="active">Desktop</button><button id="mobile">Mobiel</button><button id="open">Open ↗</button><select id="status"><option value="draft">Concept</option><option value="published">Gepubliceerd</option><option value="archived">Gearchiveerd</option></select></div></nav><div id="empty" class="empty">Kies een pagina of maak een nieuwe pagina.</div><div id="editor" hidden><div class="settings"><label>Titel<input id="title"></label><label>URL-slug<input id="slug"></label><label>Beschrijving<textarea id="desc"></textarea></label><label>SEO-titel<input id="seoTitle"></label><label>SEO-beschrijving<textarea id="seoDesc"></textarea></label></div><div id="liveMode"><div id="liveFrameWrap" class="desktop"><iframe id="liveFrame" title="Live HN-pagina"></iframe></div><div id="liveList"></div></div><div id="blockMode" hidden><div id="frame" class="desktop"><div id="canvas"></div></div></div></div></section><aside id="inspector" class="inspector"><b>Eigenschappen</b><div id="noBlock">Selecteer een CMS-blok.</div><div id="form" hidden><div class="ih"><strong id="kind"></strong><button id="dup">⧉</button><button id="remove">×</button></div><label>Type<select id="type"></select></label><label>Titel<input id="bt"></label><label>Tekst<textarea id="tx" rows="7"></textarea></label><label>Link<input id="url"></label><label>Knoptekst<input id="btn"></label><label>Afbeelding URL<input id="img"></label><label>Uitlijning<select id="align"><option>left</option><option>center</option><option>right</option></select></label><label id="cardWrap">Kaarten<textarea id="cards" placeholder="Titel | tekst | /link, één per regel"></textarea></label></div></aside></div></main></body></html>
