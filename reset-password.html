<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wachtwoord vergeten — Hijrah Netwerk</title>
<link rel="stylesheet" href="assets/auth-style.css">
</head>
<body>

<div class="auth-card">
  <a href="/login" class="back-home">← Terug naar inloggen</a>
  <div class="brand"><span class="brand-mark">HN</span> Hijrah Netwerk</div>

  <h1>Wachtwoord vergeten?</h1>
  <p class="lead">Vul je e-mailadres in. We sturen je een link om een nieuw wachtwoord in te stellen.</p>

  <div class="msg" id="msg"></div>

  <form id="reset-form">
    <div class="field">
      <label for="email">E-mailadres</label>
      <input type="email" id="email" required autocomplete="email" placeholder="jij@voorbeeld.com">
    </div>
    <button type="submit" class="btn btn-primary" id="submit-btn">Stuur resetlink</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>
<script type="module" src="assets/speed-insights-init.js"></script>
<script type="module" src="assets/analytics-init.js"></script>
<script>
  const form = document.getElementById('reset-form');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';

    const email = document.getElementById('email').value.trim();
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Bezig...';

    const { error } = await hnRequestPasswordReset(email);

    submitBtn.disabled = false;
    submitBtn.textContent = 'Stuur resetlink';

    if (error) {
      msg.className = 'msg error';
      msg.textContent = hnFriendlyError(error);
      return;
    }

    msg.className = 'msg success';
    msg.textContent = 'Als dit e-mailadres bij ons bekend is, is er een resetlink verstuurd. Check je inbox.';
    form.reset();
  });
</script>

</body>
</html>
