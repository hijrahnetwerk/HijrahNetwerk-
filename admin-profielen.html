<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>HN Profielenbeheer</title>
<style>
body{margin:0;font-family:Arial,sans-serif;color:#674C2E;background:#fff}.wrap{max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.top a{color:#674C2E}.panel{border:1px solid #674C2E;border-radius:12px;padding:20px;margin-bottom:20px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select,textarea{border:1px solid #674C2E;border-radius:8px;padding:10px 12px;box-sizing:border-box}input{min-width:260px}.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer}.primary{background:#DD842A;color:#fff}.secondary{background:#fff;color:#674C2E;border:1px solid #674C2E}.danger{background:#fff;color:#DD842A;border:1px solid #DD842A}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:11px 8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#756d63}.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#f3eee8}.ok{background:#e6f2e9}.msg{display:none;padding:11px;border-radius:8px;margin-bottom:16px}.msg.show{display:block}.edit{display:none;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.check{display:flex;gap:7px;align-items:center}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
<link rel="stylesheet" href="/assets/hn-sitewide.css?v=1">
<script src="/assets/hn-footer.js?v=1" defer></script>
<script src="/assets/hn-motion.js?v=1" defer></script>
</head><body><main class="wrap">
<div class="top"><div><a href="/admin">← Admin</a><h1>HN Profielen</h1><p>Beheer de zichtbare identiteit, HN-status en profielinstellingen van leden.</p></div><div class="actions"><a class="btn secondary" href="/admin-beloningen">HN Paspoort &amp; Beloningen</a><button class="btn secondary" id="refresh">Vernieuwen</button></div></div>
<div id="msg" class="msg"></div>
<section class="panel"><div class="filters"><input id="q" placeholder="Zoek op naam of e-mail"><select id="status"><option value="">Alle statussen</option><option value="pending">In afwachting</option><option value="approved">Goedgekeurd</option><option value="rejected">Afgewezen</option></select><select id="hnstatus"><option value="">Alle HN-statussen</option></select></div><div class="table"><table><thead><tr><th>Profiel</th><th>Toegang</th><th>HN-status</th><th>Zichtbaar</th><th>Bijdragen</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel edit" id="editor"><h2 id="title">Profiel bewerken</h2><input type="hidden" id="id"><div class="grid">
<div class="field"><label>Profielnaam</label><input id="display"></div>
<div class="field"><label>HN-status</label><select id="hn"></select></div>
<div class="field full"><label>Korte bio</label><textarea id="bio" rows="4"></textarea></div>
<div class="field"><label>Toegang</label><select id="application"><option value="pending">In afwachting</option><option value="approved">Goedgekeurd</option><option value="rejected">Afgewezen</option></select></div>
<div class="field"><label>Verificatie</label><select id="verification"><option value="unverified">Niet geverifieerd</option><option value="verified">Geverifieerd</option></select></div>
<div class="field"><label>Rol</label><select id="role"><option value="">Lid</option><option value="admin">Admin</option></select></div>
<div class="field"><label>Land/stad tonen</label><label class="check"><input type="checkbox" id="location"> Zichtbaar op profiel</label></div>
<div class="field"><label>Bijdragen tonen</label><label class="check"><input type="checkbox" id="contrib"> Reviews en bijdragen zichtbaar</label></div>
<div class="field"><label>Status tonen</label><label class="check"><input type="checkbox" id="showstatus"> HN-status zichtbaar</label></div>
<div class="field"><label>Profiel zichtbaar</label><label class="check"><input type="checkbox" id="visible"> Andere ingelogde leden mogen profiel bekijken</label></div>
</div><div class="actions" style="margin-top:18px"><button class="btn primary" id="save">Opslaan</button><button class="btn secondary" id="cancel">Annuleren</button></div></section>
</main>
<script src="/assets/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script>
<script>
const db=()=>window.hijrahSupabase,$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let rows=[],hnStatuses=[];
function msg(t,e=false){$('msg').textContent=t;$('msg').className='msg show '+(e?'':'ok');setTimeout(()=>$('msg').className='msg',4000)}
async function guard(){const s=await db().auth.getSession();if(!s.data.session){location='/login?next=/admin-profielen';return false}const r=await db().from('profiles').select('role').eq('id',s.data.session.user.id).single();if(r.error||r.data?.role!=='admin'){document.body.innerHTML='<main style="padding:60px;font-family:Arial"><h1>Geen toegang</h1><p>Alleen HN-beheerders hebben toegang.</p></main>';return false}return true}
function populateHNStatusOptions(){const filter=$('hnstatus'),editor=$('hn');if(filter)filter.innerHTML='<option value="">Alle HN-statussen</option>'+hnStatuses.map(s=>'<option value="'+esc(s.slug)+'">'+esc(s.name)+'</option>').join('');if(editor)editor.innerHTML=hnStatuses.map(s=>'<option value="'+esc(s.slug)+'">'+esc(s.name)+'</option>').join('')||'<option value="lid">Lid</option>'}
async function loadHNStatuses(){const r=await db().from('hn_statuses').select('slug,name').order('sort_order').order('name');if(r.error)return msg(r.error.message,true);hnStatuses=r.data||[];populateHNStatusOptions()}
function render(){const q=$('q').value.toLowerCase(),st=$('status').value,hs=$('hnstatus').value;const list=rows.filter(x=>(!q||((x.display_name||'')+' '+(x.first_name||'')+' '+(x.last_name||'')+' '+(x.email||'')).toLowerCase().includes(q))&&(!st||x.application_status===st)&&(!hs||x.hn_status===hs));$('rows').innerHTML=list.length?list.map(x=>'<tr><td><b>'+esc(x.display_name||[x.first_name,x.last_name].filter(Boolean).join(' ')||x.email||'Onbekend')+'</b><div>'+esc(x.email||'')+'</div></td><td><span class="status">'+esc(x.application_status||'—')+'</span> '+(x.verification_status==='verified'?'<span class="status ok">geverifieerd</span>':'')+'</td><td>'+esc(x.hn_status||'lid')+'</td><td>'+((x.profile_visibility&&x.application_status==='approved')?'Ja':'Nee')+'</td><td>'+esc(x.contribution_count||0)+' bijdrage(n)</td><td><button class="btn secondary" onclick="edit(\''+x.id+'\')">Bewerken</button> <a class="btn secondary" href="/profiel?id='+encodeURIComponent(x.id)+'" target="_blank">Profiel</a></td></tr>').join(''):'<tr><td colspan="6">Geen profielen gevonden.</td></tr>'}
async function load(){const r=await db().rpc('hn_admin_profiles');if(r.error)return msg(r.error.message,true);rows=(r.data||[]).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));const ids=rows.map(x=>x.id);const t=ids.length?await db().from('topic').select('submitted_by').in('submitted_by',ids).eq('published',true):{data:[]};const s=ids.length?await db().from('submissions').select('submitted_by').in('submitted_by',ids):{data:[]};const counts={};[...(t.data||[]),...(s.data||[])].forEach(x=>{if(x.submitted_by)counts[x.submitted_by]=(counts[x.submitted_by]||0)+1});rows=rows.map(x=>({...x,contribution_count:counts[x.id]||0}));render()}
window.edit=id=>{const x=rows.find(y=>y.id===id);if(!x)return;$('id').value=x.id;$('display').value=x.display_name||[x.first_name,x.last_name].filter(Boolean).join(' ')||'';$('bio').value=x.bio||'';$('hn').value=x.hn_status||'lid';$('application').value=x.application_status||'pending';$('verification').value=x.verification_status||'unverified';$('role').value=x.role||'';$('location').checked=x.show_location!==false;$('contrib').checked=x.show_contributions!==false;$('showstatus').checked=x.show_status!==false;$('visible').checked=x.profile_visibility!==false;$('editor').style.display='block';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
$('save').onclick=async()=>{const id=$('id').value;if(!id)return;const p={display_name:$('display').value.trim()||null,bio:$('bio').value.trim()||null,hn_status:$('hn').value,application_status:$('application').value,verification_status:$('verification').value,role:$('role').value||'member',profile_visibility:$('visible').checked,show_location:$('location').checked,show_contributions:$('contrib').checked,show_status:$('showstatus').checked,updated_at:new Date().toISOString()};if(p.application_status==='approved'&&p.verification_status==='verified')p.approved_at=new Date().toISOString();const r=await db().rpc('hn_admin_update_profile',{p_profile_id:id,p_payload:p});if(r.error)return msg(r.error.message,true);$('editor').style.display='none';await load();msg('Profiel opgeslagen.')}
$('cancel').onclick=()=>{$('editor').style.display='none'};$('q').oninput=render;$('status').onchange=render;$('hnstatus').onchange=render;$('refresh').onclick=load;
(async()=>{if(await guard()){await loadHNStatuses();await load()}})();
</script></body></html>
