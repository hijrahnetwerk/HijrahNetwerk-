<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landen & Steden — Hijrah Netwerk</title><link rel="stylesheet" href="assets/platform-pages.css"></head><body>
<link rel="stylesheet" href="assets/public-nav.css">
<script src="assets/public-nav.js"></script><main class="hero"><div class="container hero-inner"><span class="eyebrow">Verkennen</span><h1>Ontdek landen & steden.</h1><p>Bekijk de landen en steden die momenteel in HN zijn opgenomen.</p></div></main><section class="section"><div class="container"><input id="search" type="search" placeholder="Zoek een land of stad..." style="width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:20px"><div id="countryGrid" class="country-grid"><div class="search-empty">Landen laden...</div></div></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="supabase-client.js"></script><script>const db=()=>window.hijrahSupabase;let countries=[],cities=[];const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');async function init(){for(let i=0;i<60&&!db();i++)await new Promise(r=>setTimeout(r,100));if(!db())return;const[c,ci]=await Promise.all([db().from('countries').select('id,name,description,is_active').eq('is_active',true).order('name'),db().from('cities').select('id,name,country_id,is_active').eq('is_active',true).order('name')]);if(c.error||ci.error){document.getElementById('countryGrid').innerHTML='<div class="search-empty">De landen konden niet worden geladen.</div>';return}countries=c.data||[];cities=ci.data||[];render()}function render(){const q=document.getElementById('search').value.toLowerCase().trim();const list=countries.filter(c=>!q||c.name.toLowerCase().includes(q)||cities.some(x=>x.country_id===c.id&&x.name.toLowerCase().includes(q)));document.getElementById('countryGrid').innerHTML=list.length?list.map(c=>{const cs=cities.filter(x=>x.country_id===c.id);return '<a class="country-card card-link" href="navigatie.html?country='+encodeURIComponent(c.id)+'"><div class="country-top"><div><h3>'+esc(c.name)+'</h3><p>'+esc(c.description||'Bekijk beschikbare informatie.')+'</p></div><span class="count">'+cs.length+' stad'+(cs.length===1?'':'en')+'</span></div><div class="city-list">'+(cs.slice(0,10).map(x=>'<span class="city-pill">'+esc(x.name)+'</span>').join('')||'<span class="city-pill">Nog geen steden</span>')+'</div></a>'}).join(''):'<div class="search-empty">Geen passende resultaten.</div>'}document.getElementById('search').addEventListener('input',render);init();</script><script>
function toggleMobileNav(open){
  const nav=document.getElementById('mobileNav');
  const button=document.querySelector('.menu-toggle');
  if(!nav)return;
  nav.classList.toggle('open',open);
  nav.setAttribute('aria-hidden',open?'false':'true');
  if(button)button.setAttribute('aria-expanded',open?'true':'false');
  document.body.style.overflow=open?'hidden':'';
}
document.getElementById('mobileNav')?.addEventListener('click',function(e){
  if(e.target===this)toggleMobileNav(false);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')toggleMobileNav(false);
});
</script>
</body></html>
