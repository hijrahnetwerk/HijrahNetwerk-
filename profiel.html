<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HN Profiel</title>
<style>
body{margin:0;background:#fff;color:#674C2E;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top a{color:#674C2E}.hero{border:1px solid #674C2E;border-radius:16px;padding:24px}.name{font-size:28px;font-weight:700}.muted{color:#674C2E}.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#f3eee8;margin:4px 4px 0 0;font-size:12px}.verified{background:#e6f2e9}.section{border:1px solid #674C2E;border-radius:12px;padding:20px;margin-top:18px}.items{display:grid;gap:10px}.item{padding:12px;background:#faf7f3;border-radius:10px}.item a{color:#674C2E;font-weight:700}.empty{color:#674C2E}.hidden{display:none}

/* ── HN DESIGN SYSTEM UPGRADE ── */
:root{
  --gd2:#9B7735;--gd3:#C6A15B;
  --bg:#FDFAF6;--border-gd:rgba(198,161,91,.35);
  --shadow-gd:0 14px 38px rgba(198,161,91,.22);
}
/* Goud stripe */
.hn-stripe{
  height:3px;
  background:linear-gradient(90deg,#674C2E,#DD842A,#9B7735,#C6A15B,#9B7735,#DD842A,#674C2E);
  background-size:300% 100%;
  animation:hn-stripe 5s linear infinite;
}
@keyframes hn-stripe{to{background-position:300% 0}}
/* Gold divider */
.hn-divider{
  height:2px;border:none;
  background:linear-gradient(90deg,transparent,#C6A15B,#9B7735,#C6A15B,transparent);
  opacity:.55;margin:0;
}
/* Hero gradient upgrade */
.hero{
  background:
    radial-gradient(ellipse at 88% 8%,rgba(198,161,91,.35),transparent 46%),
    radial-gradient(ellipse at 8% 90%,rgba(221,132,42,.22),transparent 40%),
    linear-gradient(148deg,#3d2a14 0%,#674C2E 38%,#7a4e28 65%,#4e3018 100%)!important;
}
/* Kaarten gold-top accent */
.card.hn-card-gold,
.panel.hn-card-gold{border-top:3px solid #9B7735}
/* Animaties */
.hn-reveal{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.22,.61,.36,1),transform .6s cubic-bezier(.22,.61,.36,1)}
.hn-reveal.hn-in{opacity:1;transform:none}
.hn-d1{transition-delay:.08s}.hn-d2{transition-delay:.16s}.hn-d3{transition-delay:.24s}.hn-d4{transition-delay:.32s}
/* Btn upgrade */
.btn-primary,.button-primary,.hnbtn.primary{
  background:linear-gradient(135deg,#DD842A,#C6A15B)!important;
  box-shadow:0 8px 24px rgba(198,161,91,.25)!important;
}
/* Tab active upgrade */
.tab.active{
  background:linear-gradient(135deg,#674C2E,#DD842A)!important;
  color:#fff!important;
  border-color:transparent!important;
  box-shadow:0 5px 16px rgba(103,76,46,.22)!important;
}
/* Filter input focus */
.filter input:focus,.filter select:focus,
input:focus,select:focus,textarea:focus{
  border-color:#C6A15B!important;
  box-shadow:0 0 0 3px rgba(198,161,91,.15)!important;
}
/* Gold badge */
.hn-badge-gd{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 11px;border-radius:999px;
  font-size:11px;font-weight:800;
  background:linear-gradient(135deg,rgba(198,161,91,.18),rgba(103,76,46,.08));
  color:#9B7735;border:1px solid rgba(198,161,91,.35);
}
/* Dashboard hero upgrade */
.hero{position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;
  width:380px;height:380px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;right:-140px;bottom:-200px;
  box-shadow:0 0 0 40px rgba(255,255,255,.04),0 0 0 80px rgba(255,255,255,.025);
  pointer-events:none;
}
/* Dots patroon achtergrond */
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(103,76,46,.03) 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:-1;
}

</style>
<link rel="stylesheet" href="/assets/hn-sitewide.css?v=1">
<script src="/assets/hn-footer.js?v=1" defer></script>
<script src="/assets/hn-motion.js?v=1" defer></script>
</head><body>
<div class="hn-stripe" style="height:3px;background:linear-gradient(90deg,#674C2E,#DD842A,#9B7735,#C6A15B,#9B7735,#DD842A,#674C2E);background-size:300% 100%;animation:hn-stripe 5s linear infinite"></div><main class="wrap">
<div class="top"><a href="/dashboard">← Mijn Hijrah</a><span class="muted">HN Profiel</span></div><div id="app">Laden…</div>
</main>
<script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script>
<script>
const db=()=>window.hijrahSupabase,$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const id=new URLSearchParams(location.search).get('id');
let statusMap={};
async function init(){
 try{
 if(!db()){const detail=window.hijrahSupabaseError||'Supabase is niet geïnitialiseerd.';$('app').innerHTML='<div class="hero">De profielpagina kon niet worden geladen.<p class="muted">'+esc(detail)+'</p></div>';return}
 const s=await db().auth.getSession();if(s.error)throw s.error;if(!s.data.session){location='/login?next='+encodeURIComponent(location.pathname+location.search);return}
 if(!id){$('app').innerHTML='<div class="hero">Geen profiel geselecteerd.</div>';return}
 const r=await db().rpc('hn_public_profile',{p_id:id}).maybeSingle();
 if(r.error){console.error('[HN profiel] profiel ophalen mislukt:',r.error);$('app').innerHTML='<div class="hero">Het profiel kon niet worden geladen. Probeer de pagina opnieuw.</div>';return}
 if(!r.data){$('app').innerHTML='<div class="hero">Profiel niet gevonden of niet zichtbaar.</div>';return}
 const p=r.data;if(p.application_status!=='approved'||!p.profile_visibility){$('app').innerHTML='<div class="hero">Dit profiel is niet beschikbaar.</div>';return}
 const sr=await db().from('hn_statuses').select('slug,name,show_on_profile').eq('active',true);statusMap=Object.fromEntries((sr.data||[]).map(x=>[x.slug,x])); const name=p.display_name||[p.first_name,p.last_name].filter(Boolean).join(' ')||'HN-lid';
 const locIds=[p.current_country_id,p.current_city_id].filter(Boolean);
 let country=null,city=null;
 if(p.show_location&&locIds.length){const [c,s]=await Promise.all([p.current_country_id?db().from('countries').select('name').eq('id',p.current_country_id).maybeSingle():Promise.resolve({data:null}),p.current_city_id?db().from('cities').select('name').eq('id',p.current_city_id).maybeSingle():Promise.resolve({data:null})]);country=c.data?.name;city=s.data?.name}
 let contributions=[];
 if(p.show_contributions){
   const q=await db().from('topic').select('id,title,slug,information_type,visibility,published,source_type,created_at').eq('submitted_by',p.id).eq('published',true).order('created_at',{ascending:false}).limit(30);
   contributions=q.data||[];
 }
 $('app').innerHTML='<section class="hero"><div class="name">'+esc(name)+'</div><div style="margin-top:8px">'+(p.show_status&&statusMap[p.hn_status]?.show_on_profile?'<span class="pill">'+esc(statusMap[p.hn_status].name)+'</span>':'')+(p.verification_status==='verified'?'<span class="pill verified">Geverifieerd lid</span>':'')+'</div>'+(p.bio?'<p style="line-height:1.6">'+esc(p.bio)+'</p>':'')+((p.show_location&&(city||country))?'<div class="muted">Ervaring / locatie: '+esc([city,country].filter(Boolean).join(', '))+'</div>':'')+'</section><section class="section"><h2>HN Paspoort</h2><div id="badges" class="items"><div class="empty">Laden…</div></div></section><section class="section"><h2>Bijdragen aan HN</h2><div id="contribs" class="items">'+(p.show_contributions?(contributions.length?contributions.map(x=>'<div class="item"><a href="/fiche?id='+encodeURIComponent(x.id)+'">'+esc(x.title||'HN-bijdrage')+'</a><div class="muted">'+esc(x.information_type||'Bijdrage')+'</div></div>').join(''):'<div class="empty">Nog geen openbare bijdragen.</div>'):'<div class="empty">Deze gebruiker heeft ervoor gekozen bijdragen niet op het profiel te tonen.</div>')+'</div></section>';
 }catch(error){console.error('[HN profiel] laden mislukt:',error);const app=$('app');if(app)app.innerHTML='<div class="hero">Er ging iets mis bij het laden van dit profiel. Vernieuw de pagina en probeer opnieuw.</div>'}
}
init();
async function loadBadges(){const s=await db().auth.getSession();if(!s.data.session||!id)return;const r=await db().from('hn_user_badges').select('earned_at,badge:hn_badges(name,description,icon,show_on_profile)').eq('user_id',id).order('earned_at',{ascending:false});const el=$('badges');if(r.error||!el)return;const rows=(r.data||[]).filter(x=>x.badge?.show_on_profile);el.innerHTML=rows.length?rows.map(x=>'<div class="item"><b>'+esc(x.badge.icon||'✦')+' '+esc(x.badge.name)+'</b><div class="muted">'+esc(x.badge.description||'')+'</div></div>').join(''):'<div class="empty">Nog geen zichtbare HN-stempels.</div>'}loadBadges();
</script></body></html>
