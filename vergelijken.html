<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steden vergelijken — Hijrah Netwerk</title>
<meta name="description" content="Vergelijk landen en steden op praktische punten die belangrijk zijn voor jouw hijrah, gezin en dagelijks leven."><link rel="stylesheet" href="assets/platform-pages.css"></head><body>
<link rel="stylesheet" href="assets/public-nav.css">
<script src="assets/public-nav.js"></script><main class="hero"><div class="container hero-inner"><span class="eyebrow">Vergelijken</span><h1>Zet steden naast elkaar.</h1><p>Vergelijk op basis van de informatie die in HN beschikbaar is. Een ontbrekend gegeven betekent niet automatisch dat iets niet bestaat.</p></div></main><section class="section"><div class="container"><div class="filter"><select id="a"><option>Kies eerste stad</option></select><select id="b"><option>Kies tweede stad</option></select><select id="c"><option>Derde stad</option></select></div><div id="comparison" class="table-wrap"><div class="search-empty">Kies minstens twee steden.</div></div></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="supabase-client.js"></script><script>const db=()=>window.hijrahSupabase;let cities=[],topics=[];const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');async function init(){for(let i=0;i<60&&!db();i++)await new Promise(r=>setTimeout(r,100));if(!db())return;const[ci,tp]=await Promise.all([db().from('cities').select('id,name,is_active').eq('is_active',true).order('name'),db().from('topic').select('id,title,city_id,published,categories(name)').eq('published',true)]);if(ci.error||tp.error)return;cities=ci.data||[];topics=tp.data||[];['a','b','c'].forEach(id=>{const e=document.getElementById(id),label=e.options[0].text;e.innerHTML='<option value="">'+label+'</option>'+cities.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');e.addEventListener('change',render)})}function render(){const ids=['a','b','c'].map(id=>document.getElementById(id).value).filter(Boolean);const selected=[...new Set(ids)].map(id=>cities.find(x=>x.id===id)).filter(Boolean);if(selected.length<2)return;const d=selected.map(c=>({c,t:topics.filter(x=>x.city_id===c.id)}));document.getElementById('comparison').innerHTML='<table><thead><tr><th>Onderdeel</th>'+d.map(x=>'<th>'+esc(x.c.name)+'</th>').join('')+'</tr></thead><tbody><tr><th>Aantal topics</th>'+d.map(x=>'<td>'+x.t.length+'</td>').join('')+'</tr><tr><th>Categorieën</th>'+d.map(x=>'<td>'+esc([...new Set(x.t.map(t=>t.categories?.name).filter(Boolean))].join(', ')||'Nog geen gegevens')+'</td>').join('')+'</tr><tr><th>Onderwerpen</th>'+d.map(x=>'<td>'+esc(x.t.slice(0,5).map(t=>t.title).join(' · ')||'Nog geen gegevens')+'</td>').join('')+'</tr></tbody></table>'}init();</script><script>
function toggleMobileNav(open){
  const nav=document.getElementById('mobileNav');
  const button=document.querySelector('.menu-toggle');
  if(!nav)return;
  nav.classList.toggle('open',open);
  nav.setAttribute('aria-hidden',open?'false':'true');
  if(button)button.setAttribute('aria-expanded',open?'true':'false');
  document.body.style.overflow=open?'hidden':'';
}
document.getElementById('mobileNav')?.addEventListener('click',function(e){
  if(e.target===this)toggleMobileNav(false);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')toggleMobileNav(false);
});
</script>
</body></html>
