<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HN Paspoort & Beloningen</title><style>body{margin:0;font-family:Arial,sans-serif;color:#674C2E;background:#fff}.wrap{max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.top a{color:#674C2E}.panel{border:1px solid #674C2E;border-radius:12px;padding:20px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input,select,textarea{border:1px solid #674C2E;border-radius:8px;padding:10px 12px;box-sizing:border-box}.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer}.primary{background:#DD842A;color:#fff}.secondary{background:#fff;color:#674C2E;border:1px solid #674C2E}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px 8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#756d63}.msg{display:none;padding:11px;border-radius:8px;margin-bottom:16px}.msg.show{display:block}.ok{background:#e6f2e9}.error{background:#fff1ec}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid #674C2E;background:#fff;padding:9px 13px;border-radius:8px;cursor:pointer}.tab.active{background:#674C2E;color:#fff}.view{display:none}.view.active{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="top"><div><a href="/admin">← Admin</a><h1>HN Paspoort & Beloningen</h1><p>Beheer stempels, voorwaarden en handmatige toekenning.</p></div><a class="btn secondary" href="/admin-profielen">HN Profielen</a></div><div id="msg" class="msg"></div><div class="tabs"><button class="tab active" data-v="badges">Stempels</button><button class="tab" data-v="members">Leden</button><button class="tab" data-v="statuses">HN-statussen</button></div><section id="v-badges" class="view active"><div class="panel"><h2>Stempel beheren</h2><input type="hidden" id="id"><div class="grid"><div class="field"><label>Naam</label><input id="name"></div><div class="field"><label>Slug</label><input id="slug"></div><div class="field"><label>Categorie</label><input id="category" value="mijlpaal"></div><div class="field"><label>Icoon</label><input id="icon" value="✦"></div><div class="field"><label>Automatische trigger</label><select id="trigger"><option value="">Geen</option><option value="progress_completed">Voortgang afgerond</option><option value="topic_submitted">Bijdrage gepubliceerd</option><option value="experience_shared">Ervaring gepubliceerd</option><option value="review_shared">Review gepubliceerd</option><option value="fiche_contribution">Fichebijdrage gepubliceerd</option><option value="plan_started">Mijn Hijrah Plan gestart</option><option value="circle_stage">Hijrah Cirkel-fasen</option></select></div><div class="field"><label>Drempel</label><input id="threshold" type="number" min="1" value="1"></div><div class="field full"><label>Beschrijving</label><textarea id="description" rows="3"></textarea></div><div class="field"><label><input type="checkbox" id="manual"> Alleen handmatig</label></div><div class="field"><label><input type="checkbox" id="profile" checked> Tonen op profiel</label></div><div class="field"><label><input type="checkbox" id="active" checked> Actief</label></div><div class="field"><label>Volgorde</label><input id="sort" type="number" value="0"></div></div><p><button class="btn primary" id="save">Opslaan</button><button class="btn secondary" id="reset">Nieuwe stempel</button></p></div><div class="panel"><table><thead><tr><th>Stempel</th><th>Trigger</th><th>Drempel</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="v-members" class="view"><div class="panel"><input id="q" placeholder="Zoek lid op naam/e-mail"><select id="filter"><option value="">Alle stempels</option></select><p class="hint">Kies per lid een stempel om die handmatig toe te kennen.</p></div><div class="panel"><table><thead><tr><th>Lid</th><th>HN-status</th><th>Stempels</th><th></th></tr></thead><tbody id="members"></tbody></table></div></section><section id="v-statuses" class="view"><div class="panel"><h2>HN-status beheren</h2><input type="hidden" id="statusId"><div class="grid"><div class="field"><label>Naam</label><input id="statusName"></div><div class="field"><label>Slug</label><input id="statusSlug"></div><div class="field"><label>Icoon</label><input id="statusIcon" value="•"></div><div class="field"><label>Volgorde</label><input id="statusSort" type="number" value="0"></div><div class="field full"><label>Beschrijving</label><textarea id="statusDescription" rows="3"></textarea></div><div class="field"><label><input type="checkbox" id="statusProfile" checked> Tonen op profiel</label></div><div class="field"><label><input type="checkbox" id="statusActive" checked> Actief</label></div></div><p><button class="btn primary" id="statusSave">Opslaan</button><button class="btn secondary" id="statusReset">Nieuwe status</button></p></div><div class="panel"><table><thead><tr><th>Status</th><th>Beschrijving</th><th>Profiel</th><th>Status</th><th></th></tr></thead><tbody id="statusRows"></tbody></table></div></section></main><script src="/assets/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><script>
const db=()=>window.hijrahSupabase,$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let badges=[],members=[],statuses=[];
function msg(t,e=false){$('msg').textContent=t;$('msg').className='msg msg show '+(e?'error':'ok')}
async function guard(){const s=await db().auth.getSession();if(!s.data.session){location='/login?next=/admin-beloningen';return false}const r=await db().from('profiles').select('role').eq('id',s.data.session.user.id).single();if(r.error||r.data?.role!=='admin'){document.body.innerHTML='<main style="padding:60px"><h1>Geen toegang</h1></main>';return false}return true}
function resetStatus(){['statusId','statusName','statusSlug','statusDescription'].forEach(x=>$(x).value='');$('statusIcon').value='•';$('statusSort').value=0;$('statusProfile').checked=true;$('statusActive').checked=true} function fillStatus(s){$('statusId').value=s.id;$('statusName').value=s.name;$('statusSlug').value=s.slug;$('statusIcon').value=s.icon||'•';$('statusDescription').value=s.description||'';$('statusSort').value=s.sort_order||0;$('statusProfile').checked=!!s.show_on_profile;$('statusActive').checked=!!s.active} async function loadStatuses(){const r=await db().from('hn_statuses').select('*').order('sort_order').order('name');if(r.error)return msg(r.error.message,true);statuses=r.data||[];$('statusRows').innerHTML=statuses.map(s=>'<tr><td><b>'+esc(s.icon||'•')+' '+esc(s.name)+'</b><div>'+esc(s.slug)+'</div></td><td>'+esc(s.description||'')+'</td><td>'+(s.show_on_profile?'Ja':'Nee')+'</td><td>'+(s.active?'Actief':'Uit')+'</td><td><button class="btn secondary" data-status="'+s.id+'">Bewerken</button></td></tr>').join('')} function reset(){['id','name','slug','description'].forEach(x=>$(x).value='');$('category').value='mijlpaal';$('icon').value='✦';$('trigger').value='';$('threshold').value=1;$('manual').checked=false;$('profile').checked=true;$('active').checked=true;$('sort').value=0}
function fill(b){$('id').value=b.id;$('name').value=b.name;$('slug').value=b.slug;$('category').value=b.category;$('icon').value=b.icon;$('trigger').value=b.trigger_key||'';$('threshold').value=b.threshold;$('description').value=b.description||'';$('manual').checked=b.manual_only;$('profile').checked=b.show_on_profile;$('active').checked=b.active;$('sort').value=b.sort_order}
async function load(){const r=await db().from('hn_badges').select('*').order('sort_order').order('name');if(r.error)return msg(r.error.message,true);badges=r.data||[];$('rows').innerHTML=badges.map(b=>'<tr><td><b>'+esc(b.icon)+' '+esc(b.name)+'</b><div>'+esc(b.description||'')+'</div></td><td>'+esc(b.trigger_key||'Handmatig')+'</td><td>'+b.threshold+'</td><td>'+(b.active?'Actief':'Uit')+'</td><td><button class="btn secondary" onclick="fill('+JSON.stringify(b).replaceAll('"','&quot;')+')">Bewerken</button></td></tr>').join('');$('filter').innerHTML='<option value="">Alle stempels</option>'+badges.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('');await loadMembers()}
async function loadMembers(){
 const r=await db().from('profiles').select('id,display_name,first_name,last_name,email,hn_status').eq('application_status','approved').order('created_at',{ascending:false});
 members=r.data||[];
 const e=await db().from('hn_user_badges').select('user_id,badge_id,earned_at,badge:hn_badges(name,icon)');
 const by={};
 (e.data||[]).forEach(x=>(by[x.user_id]??=[]).push(x));
 const q=($('q').value||'').toLowerCase(),f=$('filter').value;
 const list=members.filter(m=>(!q||((m.display_name||'')+' '+(m.email||'')).toLowerCase().includes(q))&&(!f||((by[m.id]||[]).some(x=>x.badge_id===f))));
 $('members').innerHTML=list.map(m=>{
   const earned=(by[m.id]||[]).map(x=>esc(x.badge?.icon||'✦')+' '+esc(x.badge?.name||'')).join('<br>')||'Geen';
   const options=badges.map(b=>'<option value="'+esc(b.slug)+'">'+esc(b.name)+'</option>').join('');
   return '<tr><td><b>'+esc(m.display_name||m.email)+'</b><div>'+esc(m.email||'')+'</div></td><td>'+esc(m.hn_status||'lid')+'</td><td>'+earned+'</td><td><select class="award-select" data-user="'+m.id+'">'+options+'</select> <button class="btn primary" data-award="'+m.id+'">Toekennen</button></td></tr>';
 }).join('');
}
async function award(uid){const select=document.querySelector('.award-select[data-user="'+uid+'"]');const slug=select?.value;if(!slug)return msg('Kies eerst een stempel.',true);const r=await db().rpc('award_hn_badge',{p_user_id:uid,p_badge_slug:slug,p_source:'manual'});if(r.error)return msg(r.error.message,true);msg('Stempel toegekend.');await loadMembers()}
$('statusSave').onclick=async()=>{const p={name:$('statusName').value.trim(),slug:$('statusSlug').value.trim(),icon:$('statusIcon').value.trim()||'•',description:$('statusDescription').value.trim()||null,sort_order:Number($('statusSort').value)||0,show_on_profile:$('statusProfile').checked,active:$('statusActive').checked,updated_at:new Date().toISOString()};if(!p.name||!p.slug)return msg('Naam en slug van de HN-status zijn verplicht.',true);const r=$('statusId').value?await db().from('hn_statuses').update(p).eq('id',$('statusId').value):await db().from('hn_statuses').insert(p);if(r.error)return msg(r.error.message,true);resetStatus();await loadStatuses();msg('HN-status opgeslagen.');} $('statusReset').onclick=resetStatus;
document.addEventListener('click',e=>{const b=e.target.closest('[data-award]');if(b)award(b.dataset.award)}); document.addEventListener('click',e=>{const s=e.target.closest('[data-status]');if(s)fillStatus(statuses.find(x=>x.id===s.dataset.status))}); $('save').onclick=async()=>{const p={name:$('name').value.trim(),slug:$('slug').value.trim(),category:$('category').value.trim()||'mijlpaal',icon:$('icon').value.trim()||'✦',trigger_key:$('trigger').value||null,threshold:Math.max(1,Number($('threshold').value)||1),description:$('description').value.trim()||null,manual_only:$('manual').checked,show_on_profile:$('profile').checked,active:$('active').checked,sort_order:Number($('sort').value)||0,updated_at:new Date().toISOString()};if(!p.name||!p.slug)return msg('Naam en slug zijn verplicht.',true);const r=$('id').value?await db().from('hn_badges').update(p).eq('id',$('id').value):await db().from('hn_badges').insert(p);if(r.error)return msg(r.error.message,true);reset();load();msg('Stempel opgeslagen.')}
$('reset').onclick=reset;$('q').oninput=loadMembers;$('filter').onchange=loadMembers;document.querySelectorAll('.tab').forEach(t=>t.onclick=async()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('v-'+t.dataset.v).classList.add('active')});(async()=>{if(await guard()){reset();resetStatus();await load();await loadStatuses()}})();
</script></body></html>
