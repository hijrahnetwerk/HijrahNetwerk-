<style>.nav-item{margin:12px 0;padding:14px;border:1px solid #d8c5aa;border-radius:12px;background:#fff;transition:border-color .15s,background .15s}.nav-item .section-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}.nav-item .handle{font-size:20px;color:#9B7735;cursor:grab}.nav-item .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.nav-item .row label{display:block;font-size:12px;font-weight:700}.nav-item input:not([type=checkbox]){display:block;width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c5aa;border-radius:7px;margin-top:5px}.nav-item .nav-visible{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12px}.nav-item .nav-actions{display:flex;gap:5px}.nav-item .nav-actions button{padding:6px 9px}.nav-item button:disabled{opacity:.35;cursor:not-allowed}.nav-item.is-dragging{opacity:.45}.nav-item.drop-target{border:2px dashed #DD842A;background:#fff8ee}.nav-item .section-head b{margin-right:auto}@media(max-width:650px){.nav-item .row{grid-template-columns:1fr}.nav-item .section-head{align-items:flex-start;flex-wrap:wrap}}</style></head><body><main class="hn-builder"><header class="builder-top"><div><a href="/admin">← Admin</a><h1>Navigatiebeheer</h1><p>Beheer menu-items en hun volgorde zonder code.</p></div><button id="save" class="button primary">Opslaan</button></header><div id="msg" class="msg" hidden></div><section class="panel"><div class="editorbar"><h2>Hoofdmenu</h2><button id="add" class="button secondary">+ Menu-item</button></div><p class="muted">Sleep items om de volgorde te wijzigen. Verbergen haalt een item uit het menu zonder het te verwijderen.</p><div id="items"></div></section></main></body></html>
