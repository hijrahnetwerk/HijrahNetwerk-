<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kennisbank — Hijrah Netwerk</title>
  <meta
    name="description"
    content="Doorzoek de Hijrah Netwerk kennisbank op land, stad en onderwerp."
  >

  <style>
    :root {
      --brown: #684a25;
      --brown-dark: #4d3819;
      --orange: #df842c;
      --gold: #e9a74b;
      --cream: #fbf8f4;
      --white: #ffffff;
      --ink: #2b241c;
      --muted: #6f665b;
      --line: #ece5da;
      --success: #3f744b;
      --success-bg: #e8f3ea;
      --shadow: 0 10px 30px rgba(104, 74, 37, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      color: var(--ink);
      background: var(--cream);
      line-height: 1.55;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input,
    select {
      font: inherit;
    }

    main.wrap {
      width: min(1120px, calc(100% - 80px)) !important;
      max-width: 1120px !important;
      margin: 0 auto !important;
      padding: 0 0 60px !important;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-weight: 800;
      color: var(--brown-dark);
      font-size: 19px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links a {
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
    }

    .nav-links a:hover {
      background: #f5efe7;
      color: var(--brown-dark);
    }

    .hero {
      padding: 65px clamp(28px, 5vw, 64px) 35px;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #fdf1e3;
      color: #a55e16;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hero h1 {
      margin: 15px 0 12px;
      color: var(--brown-dark);
      font-size: clamp(34px, 5vw, 50px);
      line-height: 1.1;
    }

    .hero p {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      max-width: 900px;
    }

    .search-row input {
      flex: 1;
      min-width: 0;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .search-row input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(223, 132, 44, 0.1);
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 11px 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--orange);
      color: white;
    }

    .btn-secondary {
      background: #f2ece4;
      color: var(--brown-dark);
    }

    .btn-saved {
      background: var(--success-bg);
      color: var(--success);
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 18px;
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--ink);
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 30px 0 15px;
    }

    .results-header h2 {
      margin: 0;
      color: var(--brown-dark);
      font-size: 23px;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding-bottom: 50px;
    }

    .article-card {
      display: flex;
      flex-direction: column;
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 21px;
      box-shadow: 0 1px 2px rgba(43, 36, 28, 0.04);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 13px;
    }

    .tag {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f6f0e8;
      color: var(--brown);
      font-size: 11px;
      font-weight: 800;
    }

    .article-card h3 {
      margin: 0 0 9px;
      color: var(--brown-dark);
      font-size: 18px;
      line-height: 1.3;
    }

    .article-card p {
      margin: 0 0 17px;
      color: var(--muted);
      font-size: 14px;
      flex: 1;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 38px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      background: white;
    }

    .article-view {
      display: none;
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 38px;
      margin: 25px 0 50px;
    }

    .article-view h2 {
      margin: 10px 0 12px;
      color: var(--brown-dark);
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.15;
    }

    .article-content {
      margin-top: 25px;
      color: #3f382f;
      line-height: 1.75;
    }

    .article-content h3 {
      margin: 30px 0 10px;
      color: var(--brown-dark);
      font-size: 19px;
      line-height: 1.3;
    }

    .article-content h3:first-child { margin-top: 0; }
    .article-content p { margin: 0 0 16px; }
    .article-content ul { margin: 0 0 18px 20px; padding: 0; }
    .article-content li { margin: 7px 0; }

    .article-source {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }

    .notice {
      display: none;
      margin: 15px 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fdf1e3;
      color: var(--brown-dark);
    }

    .notice.show {
      display: block;
    }

    @media (max-width: 950px) {
      .filters {
        grid-template-columns: repeat(2, 1fr);
      }

      .results {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      main.wrap {
        width: calc(100% - 48px) !important;
        max-width: none !important;
        margin: 0 auto !important;
        padding-bottom: 40px !important;
      }

      .nav {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }

      .hero {
        padding: 40px 20px 28px;
      }

      .search-row {
        flex-direction: column;
      }

      .filters,
      .results {
        grid-template-columns: 1fr;
      }

      .article-view {
        padding: 24px 20px;
      }
    }
  
    .article-toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin-top:22px;
    }

    .save-action{
      margin-top:22px;
      padding:16px 18px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }

    .save-action-copy{
      min-width:0;
    }

    .save-action-copy strong{
      display:block;
      color:var(--brown-dark);
      margin-bottom:3px;
      font-size:15px;
    }

    .save-action-copy span{
      display:block;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }

    .save-action .heart-btn{
      flex:0 0 auto;
      min-height:44px;
      padding:11px 17px;
      background:#f7f1e8;
      border-color:#dfd1bd;
    }

    .save-action .heart-btn.saved{
      background:var(--success-bg);
      border-color:#cfe2d2;
    }

    .heart-btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--brown-dark);
      border-radius:999px;
      padding:10px 15px;
      font-weight:700;
      cursor:pointer;
    }

    .heart-btn .heart{
      font-size:19px;
      line-height:1;
    }

    .heart-btn.saved{
      background:var(--success-bg);
      border-color:#cfe2d2;
      color:var(--success);
    }

    .fiche-cta{
      margin-top:24px;
      padding:19px 20px;
      border:1px solid #eadcca;
      background:#fff8ef;
      border-radius:16px;
    }

    .fiche-cta strong{
      display:block;
      margin-bottom:5px;
      color:var(--brown-dark);
    }

    .article-bottom{
      margin-top:34px;
      padding-top:28px;
      border-top:1px solid var(--line);
    }

    .article-bottom h3{
      margin:0 0 14px;
      color:var(--brown-dark);
      font-size:20px;
    }

    .share-row,
    .article-nav,
    .related-grid{
      display:grid;
      gap:10px;
    }

    .share-row{
      grid-template-columns:repeat(4,auto);
      justify-content:start;
    }

    .share-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:40px;
      padding:9px 13px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:var(--brown-dark);
      font-size:13px;
      font-weight:700;
    }

    .share-btn:hover{
      border-color:var(--orange);
      color:var(--orange-dark);
    }

    .submission-cta{
      margin-top:28px;
      padding:22px;
      border-radius:18px;
      background:var(--brown-dark);
      color:#fff;
    }

    .submission-cta h3{
      color:#fff;
      margin-bottom:7px;
    }

    .submission-cta p{
      color:#eadfce;
      margin:0 0 15px;
    }

    .article-nav{
      grid-template-columns:1fr 1fr;
      margin-top:28px;
    }

    .article-nav-link{
      display:block;
      padding:16px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
    }

    .article-nav-link.next{
      text-align:right;
    }

    .article-nav-label{
      display:block;
      color:var(--muted);
      font-size:12px;
      margin-bottom:5px;
    }

    .article-nav-title{
      color:var(--brown-dark);
      font-weight:750;
    }

    .related-grid{
      grid-template-columns:repeat(3,1fr);
      margin-top:12px;
    }

    .related-card{
      display:block;
      padding:17px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
    }

    .related-card:hover{
      border-color:#dfc9ac;
      box-shadow:var(--shadow);
    }

    .related-card h4{
      margin:7px 0 6px;
      color:var(--brown-dark);
      line-height:1.35;
    }

    .related-card p{
      margin:0;
      color:var(--muted);
      font-size:13px;
    }

    @media(max-width:850px){
      .related-grid{grid-template-columns:1fr 1fr}
    }

      .community-submit{
        align-items:stretch;
        flex-direction:column;
      }

      .community-submit .btn{
        width:100%;
        text-align:center;
      }

    @media(max-width:650px){      .save-action{
        flex-direction:column;
        align-items:stretch;
      }

      .save-action .heart-btn{
        width:100%;
        justify-content:center;
      }

      .share-row{grid-template-columns:1fr 1fr}
      .article-nav{grid-template-columns:1fr}
      .article-nav-link.next{text-align:left}
      .related-grid{grid-template-columns:1fr}
    }


.mobile-menu-toggle{display:none;align-items:center;justify-content:center;flex-direction:column;gap:4px;width:42px;height:42px;border:1px solid var(--line,#e8e1d8);border-radius:10px;background:#fff;cursor:pointer}
.mobile-menu-toggle span{display:block;width:18px;height:2px;border-radius:2px;background:var(--brown,#684a25)}
.desktop-only{display:flex}
.mobile-nav{position:fixed;inset:0;z-index:999;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease}
.mobile-nav.open{opacity:1;visibility:visible;pointer-events:auto}
.mobile-nav-backdrop{position:absolute;inset:0;background:rgba(43,36,28,.4)}
.mobile-nav-panel{position:absolute;right:0;top:0;height:100%;width:min(88vw,360px);background:#fff;padding:20px;box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:5px;transform:translateX(100%);transition:transform .25s ease}
.mobile-nav.open .mobile-nav-panel{transform:translateX(0)}
.mobile-nav-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mobile-nav-close{width:38px;height:38px;border:1px solid var(--line,#e8e1d8);background:#fff;border-radius:50%;font-size:24px;line-height:1;cursor:pointer;color:var(--brown-dark,#4d3819)}
.mobile-nav-panel>a{padding:13px 11px;border-radius:10px;color:var(--brown-dark,#4d3819);font-weight:600}
.mobile-nav-panel>a:hover{background:#f5efe8}

@media(max-width:680px){
  .desktop-only{display:none!important}
  .mobile-menu-toggle{display:flex}
}
</style>
</head>

<body>
<link rel="stylesheet" href="assets/public-nav.css">
<script src="assets/public-nav.js"></script>

<main class="wrap">

  <section class="hero">
    <span class="eyebrow">Kennisbank</span>

    <h1>Vind praktische HN-informatie.</h1>

    <p>
      Zoek informatie over landen, steden en onderwerpen binnen de
      Hijrah Netwerk kennisbank.
    </p>

    <form id="searchForm" class="search-row">
      <input
        id="searchInput"
        type="search"
        placeholder="Zoek bijvoorbeeld: huren in Tanger"
        autocomplete="off"
      >

      <button class="btn btn-primary" type="submit">
        Zoeken
      </button>
    </form>
  </section>

  <div id="notice" class="notice"></div>

  <section class="filters">

    <select id="countryFilter">
      <option value="">Alle landen</option>
    </select>

    <select id="cityFilter">
      <option value="">Alle steden</option>
    </select>

    <select id="categoryFilter">
      <option value="">Alle categorieën</option>
    </select>

    <select id="subcategoryFilter">
      <option value="">Alle subcategorieën</option>
    </select>

  </section>

  <section id="articleView" class="article-view"></section>

  <section id="listView">

    <div class="results-header">
      <h2>Artikelen</h2>

      <span id="resultCount" class="muted">
        Laden…
      </span>
    </div>

    <div id="results" class="results"></div>

  </section>

</main>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script type="module" src="assets/speed-insights-init.js"></script>
<script type="module" src="assets/analytics-init.js"></script>

<script>

  const db = () => window.hijrahSupabase;

  let topics = [];
  let countries = [];
  let cities = [];
  let categories = [];
  let subcategories = [];
  let savedTopics = new Set();

  const params =
    new URLSearchParams(
      window.location.search
    );


  /* =========================
     ALGEMENE FUNCTIES
  ========================= */

  function esc(value) {

    if (value == null) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function normalize(value) {

    return String(value || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

  }

  function formatArticleDate(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleDateString("nl-NL", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });
  }
  function showNotice(text) {

    const element =
      document.getElementById("notice");

    element.textContent = text;
    element.classList.add("show");

    clearTimeout(
      window.__noticeTimer
    );

    window.__noticeTimer =
      setTimeout(() => {

        element.classList.remove(
          "show"
        );

      }, 4000);

  }

  function fillSelect(
    id,
    items,
    label
  ) {

    const select =
      document.getElementById(id);

    select.innerHTML =
      `<option value="">${label}</option>` +
      items
        .map(
          item =>
            `<option value="${esc(item.id)}">${esc(item.name)}</option>`
        )
        .join("");

  }


  /* =========================
     ACTIVITEIT LOGGEN
  ========================= */

  async function logUserActivity(
    activityType,
    description,
    details = null
  ) {

    try {

      const {
        data: sessionData,
        error: sessionError
      } = await db()
        .auth
        .getSession();

      if (
        sessionError ||
        !sessionData?.session
      ) {
        return;
      }

      const user =
        sessionData.session.user;

      if (!user) {
        return;
      }

      const { error } =
        await db()
          .from("user_activity")
          .insert({
            user_id: user.id,
            activity_type: activityType,
            description: description,
            details: details
          });

      if (error) {

        console.warn(
          "Activiteit kon niet worden opgeslagen:",
          error.message
        );

      }

    } catch (error) {

      console.warn(
        "Activiteit logging mislukt:",
        error
      );

    }

  }


  /* =========================
     FILTERS
  ========================= */

  function getFilteredTopics() {

    const query =
      normalize(
        document
          .getElementById("searchInput")
          .value
      );

    const countryId =
      document
        .getElementById("countryFilter")
        .value;

    const cityId =
      document
        .getElementById("cityFilter")
        .value;

    const categoryId =
      document
        .getElementById("categoryFilter")
        .value;

    const subcategoryId =
      document
        .getElementById("subcategoryFilter")
        .value;

    return topics.filter(topic => {

      if (
        countryId &&
        topic.country_id !== countryId
      ) {
        return false;
      }

      if (
        cityId &&
        topic.city_id !== cityId
      ) {
        return false;
      }

      if (
        categoryId &&
        topic.category_id !== categoryId
      ) {
        return false;
      }

      if (
        subcategoryId &&
        topic.subcategory_id !== subcategoryId
      ) {
        return false;
      }

      if (!query) {
        return true;
      }

      const searchable =
        normalize([
          topic.title,
          topic.summary,
          topic.content,
          topic.information_type,
          topic.countries?.name,
          topic.cities?.name,
          topic.categories?.name,
          topic.subcategories?.name
        ].join(" "));

      return query
        .split(/\s+/)
        .filter(Boolean)
        .every(
          word =>
            searchable.includes(word)
        );

    });

  }


  /* =========================
     RESULTATEN
  ========================= */


  function hasFiche(topic) {
    const card = topic?.card_data;
    return !!(
      card &&
      typeof card === "object" &&
      (
        card.doctor_name ||
        card.full_name ||
        card.service_type ||
        card.address ||
        card.phone
      )
    );
  }

  function articleUrl(topicId) {
    return window.location.origin +
      "/kennisbank.html?topic=" +
      encodeURIComponent(topicId);
  }

  function setMeta(name, content) {
    let element = document.querySelector(
      'meta[name="' + name + '"]'
    );

    if (!element) {
      element = document.createElement("meta");
      element.setAttribute("name", name);
      document.head.appendChild(element);
    }

    element.setAttribute("content", content);
  }

  function setProperty(property, content) {
    let element = document.querySelector(
      'meta[property="' + property + '"]'
    );

    if (!element) {
      element = document.createElement("meta");
      element.setAttribute("property", property);
      document.head.appendChild(element);
    }

    element.setAttribute("content", content);
  }

  function setCanonical(url) {
    let link = document.querySelector('link[rel="canonical"]');

    if (!link) {
      link = document.createElement("link");
      link.setAttribute("rel", "canonical");
      document.head.appendChild(link);
    }

    link.setAttribute("href", url);
  }

  function updateArticleSeo(topic) {
    const title = topic?.title
      ? topic.title + " — Hijrah Netwerk"
      : "Kennisbank — Hijrah Netwerk";

    const description = (
      topic?.summary ||
      "Praktische informatie uit de Hijrah Netwerk kennisbank."
    )
      .replace(/\\n/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 155);

    const url = articleUrl(topic.id);

    document.title = title;
    setMeta("description", description);
    setMeta("robots", "index,follow");

  function shareArticle(topic, channel) {
    const url = articleUrl(topic.id);
    const title = String(topic.title || "Hijrah Netwerk");
    const text = title + " — Hijrah Netwerk";

    if (channel === "copy") {
      navigator.clipboard?.writeText(url)
        .then(() => showNotice("Link gekopieerd."))
        .catch(() => showNotice("De link kon niet automatisch worden gekopieerd."));
      return;
    }

    const links = {
      whatsapp:
        "https://wa.me/?text=" +
        encodeURIComponent(text + " " + url),
      facebook:
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(url),
      x:
        "https://twitter.com/intent/tweet?text=" +
        encodeURIComponent(text) +
        "&url=" +
        encodeURIComponent(url)
    };

    if (links[channel]) {
      window.open(
        links[channel],
        "_blank",
        "noopener,noreferrer,width=720,height=650"
      );
    }
  }

  function formatArticleContent(value) {
    const raw = value == null ? "" : String(value);
    const text = raw
      .replace(/\\r/g, "")
      .replace(/\\n/g, "\n")
      .replace(/\r/g, "")
      .trim();
    if (!text) return "<p>Geen inhoud beschikbaar.</p>";

    const headingPattern = /^(Opleiding en professionele achtergrond|Over het cabinet|Consultaties|Afspraken|Huisbezoeken|Teleconsultatie|Belangrijk)$/i;
    const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
    const sections = [];
    let heading = "";
    let body = [];

    const pushSection = () => {
      if (heading || body.length) sections.push({heading, body:[...body]});
      heading = "";
      body = [];
    };

    lines.forEach(line => {
      if (headingPattern.test(line)) {
        pushSection();
        heading = line;
      } else {
        body.push(line);
      }
    });
    pushSection();

    return sections.map(section => {
      const parts = [];
      let bullets = [];

      const flushBullets = () => {
        if (!bullets.length) return;
        parts.push("<ul>" + bullets.map(item => "<li>" + esc(item.replace(/^•\\s*/, "")) + "</li>").join("") + "</ul>");
        bullets = [];
      };

      section.body.forEach(line => {
        if (/^•\\s*/.test(line)) {
          bullets.push(line);
          return;
        }
        flushBullets();
        const clean = line.replace(/\s+/g, " ").trim();
        if (clean) parts.push("<p>" + esc(clean) + "</p>");
      });

      flushBullets();
      if (!parts.length) return "";
      const headingHtml = section.heading ? "<h3>" + esc(section.heading) + "</h3>" : "";
      return headingHtml + parts.join("");
    }).join("");
  }

  async function loadSavedArticles() {

    const {
      data: sessionData
    } = await db()
      .auth
      .getSession();

    const session =
      sessionData?.session;

    if (!session) {
      return;
    }

    const {
      data,
      error
    } = await db()
      .from("saved_articles")
      .select("topic_id")
      .eq(
        "user_id",
        session.user.id
      );

    if (error) {

      console.warn(
        "saved_articles:",
        error
      );

      return;
    }

    savedTopics =
      new Set(
        (data || [])
          .map(row => row.topic_id)
      );

  }


  async function toggleSaved(
    topicId
  ) {

    const {
      data: sessionData
    } = await db()
      .auth
      .getSession();

    const session =
      sessionData?.session;

    if (!session) {

      window.location.href =
        "login.html";

      return;
    }

    const topic =
      topics.find(
        item =>
          item.id === topicId
      );

    if (
      savedTopics.has(topicId)
    ) {

      const {
        error
      } = await db()
        .from("saved_articles")
        .delete()
        .eq(
          "user_id",
          session.user.id
        )
        .eq(
          "topic_id",
          topicId
        );

      if (error) {

        showNotice(
          error.message
        );

        return;
      }

      savedTopics.delete(
        topicId
      );

      await logUserActivity(
        "saved_article_removed",
        "Kennisbankartikel verwijderd uit opgeslagen informatie",
        {
          topic_id: topicId,
          title:
            topic?.title || null
        }
      );

      showNotice(
        "Artikel verwijderd uit je opgeslagen informatie."
      );

    } else {

      const {
        error
      } = await db()
        .from("saved_articles")
        .insert({
          user_id:
            session.user.id,
          topic_id:
            topicId
        });

      if (error) {

        showNotice(
          error.message
        );

        return;
      }

      savedTopics.add(
        topicId
      );

      await logUserActivity(
        "saved_article_added",
        "Kennisbankartikel opgeslagen",
        {
          topic_id: topicId,
          title:
            topic?.title || null
        }
      );

      showNotice(
        "Opgeslagen in Mijn Hijrah."
      );

    }

    renderResults();

    /*
      Wanneer iemand het artikel al open heeft,
      moet de knop daar ook meteen veranderen.
    */

    const articleView =
      document.getElementById(
        "articleView"
      );

    if (
      articleView.style.display ===
        "block"
    ) {

      openArticle(
        topicId,
        false
      );

    }

  }

  async function loadCommunityExperiences(topic) {
    const box = document.getElementById("communityExperiences");
    if (!box) return;

    box.innerHTML = `<div class="community-empty">Community-ervaringen laden…</div>`;

    try {
      const { data, error } = await db()
        .from("topic")
        .select("id,title,summary,content,information_type,card_data,created_at,city_id,country_id,category_id,published,source_type")
        .eq("published", true)
        .eq("source_type", "community")
        .in("information_type", ["Ervaring", "Review"])
        .order("created_at", { ascending: false })
        .limit(50);

      if (error) {
        console.warn("Community-ervaringen konden niet worden geladen:", error.message);
        box.innerHTML = `<div class="community-empty">Community-ervaringen konden momenteel niet worden geladen.</div>`;
        return;
      }

      const matches = (data || [])
        .filter(item => item.id !== topic.id)
        .filter(item => {
          const cityMatch = topic.city_id && item.city_id === topic.city_id;
          const countryMatch = topic.country_id && item.country_id === topic.country_id;
          const categoryMatch = topic.category_id && item.category_id === topic.category_id;
          return cityMatch || countryMatch || categoryMatch;
        })
        .slice(0, 5);

      if (!matches.length) {
        box.innerHTML = `<div class="community-empty">Er zijn nog geen goedgekeurde community-ervaringen voor deze informatie.</div>`;
        return;
      }

      box.innerHTML = matches.map(item => `
        <article class="community-item">
          <p class="community-item-text">${esc(getCommunityItemText(item))}</p>
          <div class="community-item-meta">
            ${esc(getCommunityItemName(item))}

            ${item.created_at ? " · " + esc(formatArticleDate(item.created_at)) : ""}

      console.warn("Community-ervaringen laden mislukt:", error);
      box.innerHTML = `<div class="community-empty">Community-ervaringen konden momenteel niet worden geladen.</div>`;
    }
  }

    const city = topic?.cities?.name || "deze stad";

    if (category.includes("gezondheid")) {
      return [
        "Huisartsen en medische praktijken in " + city,
        "Ziekenhuizen en klinieken in " + city,
        "Spoedzorg en medische hulp in " + city,

        "Wijken en buurten in " + city,
        "Huurcontracten en borg in " + country,
        "Een woning kopen in " + city

        "Onderwijs voor kinderen in " + country,
        "Islamitisch onderwijs in " + city,
        "Taalonderwijs en taalscholen in " + city

  function openArticle(
    topicId,
    updateUrl = true
  ) {

    const topic =
      topics.find(
        item => item.id === topicId
      );

    if (!topic) {
      return;
    }

    const articleView =
      document.getElementById("articleView");

    document.getElementById("listView").style.display = "none";
    articleView.style.display = "block";

    updateArticleSeo(topic);

    const currentIndex = topics.findIndex(
      item => item.id === topic.id
    );

    const previous =
      currentIndex > 0
        ? topics[currentIndex - 1]
        : null;

    const next =
      currentIndex < topics.length - 1
        ? topics[currentIndex + 1]
        : null;

    const related = topics
      .filter(item => item.id !== topic.id)
      .map(item => {
        let score = 0;

        if (
          topic.category_id &&
          item.category_id === topic.category_id
        ) score += 4;

        if (
          topic.city_id &&
          item.city_id === topic.city_id
        ) score += 3;

        if (
          topic.country_id &&
          item.country_id === topic.country_id
        ) score += 2;

        return {item,score};
      })
      .filter(x => x.score > 0)
      .sort((a,b) => b.score - a.score)
      .slice(0,3)
      .map(x => x.item);

    const fallbackRelated = related.length
      ? related
      : topics
          .filter(item => item.id !== topic.id)
          .slice(0,3);

    const saved = savedTopics.has(topic.id);
    const publicArticleUrl = articleUrl(topic.id);

  function closeArticle() {

    document.getElementById(
      "articleView"
    ).style.display = "none";

    clearArticleSeo();

    document.getElementById(
      "listView"
    ).style.display = "block";

    const query =
      document
        .getElementById("searchInput")
        .value
        .trim();

    const country =
      document
        .getElementById("countryFilter")
        .value;

    const queryParams =
      new URLSearchParams();

    if (query) {
      queryParams.set(
        "q",
        query
      );
    }

    if (country) {
      queryParams.set(
        "country",
        country
      );
    }

    const queryString =
      queryParams.toString();

    history.replaceState(
      {},
      "",
      queryString
        ? `kennisbank.html?${queryString}`
        : "kennisbank.html"
    );

  }


  /* =========================
     DATA LADEN
  ========================= */

  async function loadData() {

    const [
      countriesResult,
      citiesResult,
      categoriesResult,
      subcategoriesResult,
      topicsResult
    ] = await Promise.all([

      db()
        .from("countries")
        .select(
          "id,name,slug,is_active"
        )
        .eq(
          "is_active",
          true
        )
        .order("name"),

      db()
        .from("cities")
        .select(
          "id,name,slug,country_id,is_active"
        )
        .eq(
          "is_active",
          true
        )
        .order("name"),

      db()
        .from("categories")
        .select(
          "id,name,slug,is_active"
        )
        .eq(
          "is_active",
          true
        )
        .order("sort_order")
        .order("name"),

      db()
        .from("subcategories")
        .select(
          "id,name,category_id,is_active"
        )
        .eq(
          "is_active",
          true
        )
        .order("sort_order")
        .order("name"),

      db()
        .from("topic")
        .select(`
          *,
          countries(name),
          cities(name),
          categories(name),
          subcategories(name)
        `)
        .eq(
          "published",
          true
        )
        .order(
          "updated_at",
          {
            ascending: false
          }
        )

    ]);

    const results = [
      countriesResult,
      citiesResult,
      categoriesResult,
      subcategoriesResult,
      topicsResult
    ];

    const firstError =
      results.find(
        result =>
          result.error
      );

    if (firstError) {
      throw firstError.error;
    }

    countries =
      countriesResult.data || [];

    cities =
      citiesResult.data || [];

    categories =
      categoriesResult.data || [];

    subcategories =
      subcategoriesResult.data || [];

    topics =
      topicsResult.data || [];

    fillSelect(
      "countryFilter",
      countries,
      "Alle landen"
    );

    fillSelect(
      "cityFilter",
      cities,
      "Alle steden"
    );

    fillSelect(
      "categoryFilter",
      categories,
      "Alle categorieën"
    );

    fillSelect(
      "subcategoryFilter",
      subcategories,
      "Alle subcategorieën"
    );

    await loadSavedArticles();

    if (params.get("q")) {

      document.getElementById(
        "searchInput"
      ).value =
        params.get("q");

    }

    if (params.get("country")) {

      document.getElementById(
        "countryFilter"
      ).value =
        params.get("country");

    }

    renderResults();

    if (params.get("topic")) {

      openArticle(
        params.get("topic")
      );

    }

  }


  /* =========================
     ZOEKEN
  ========================= */

  document
    .getElementById("searchForm")
    .addEventListener(
      "submit",
      event => {

        event.preventDefault();

        const query =
          document
            .getElementById(
              "searchInput"
            )
            .value
            .trim();

        const country =
          document
            .getElementById(
              "countryFilter"
            )
            .value;

        const queryParams =
          new URLSearchParams();

        if (query) {

          queryParams.set(
            "q",
            query
          );

        }

        if (country) {

          queryParams.set(
            "country",
            country
          );

        }

        const queryString =
          queryParams.toString();

        history.replaceState(
          {},
          "",
          queryString
            ? `kennisbank.html?${queryString}`
            : "kennisbank.html"
        );

        renderResults();

      }
    );


  /* =========================
     FILTERS
  ========================= */

  [
    "searchInput",
    "countryFilter",
    "cityFilter",
    "categoryFilter",
    "subcategoryFilter"
  ].forEach(id => {

    document
      .getElementById(id)
      .addEventListener(
        "input",
        renderResults
      );

    document
      .getElementById(id)
      .addEventListener(
        "change",
        renderResults
      );

  });


  /* =========================
     START
  ========================= */

  loadData()
    .catch(error => {

      console.error(
        "HN Kennisbank:",
        error
      );

      showNotice(
        "De kennisbank kon niet worden geladen: " +
        error.message
      );

      document.getElementById(
        "results"
      ).innerHTML = `
        <div class="empty">
          De kennisbank kon momenteel niet worden geladen.
        </div>
      `;

    });

</script>

<script src="assets/scroll-reveal.js"></script>

<script>
function toggleMobileNav(open){
  var nav=document.getElementById('mobileNav');
  var button=document.querySelector('.mobile-menu-toggle');
  if(!nav)return;
  if(open){
    nav.classList.add('open');
    nav.setAttribute('aria-hidden','false');
    if(button)button.setAttribute('aria-expanded','true');
    document.body.style.overflow='hidden';
  }else{
    nav.classList.remove('open');
    nav.setAttribute('aria-hidden','true');
    if(button)button.setAttribute('aria-expanded','false');
    document.body.style.overflow='';
  }
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')toggleMobileNav(false);
});
</script>
