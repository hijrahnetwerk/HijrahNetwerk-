<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — Hijrah Netwerk</title>
<link rel="stylesheet" href="assets/auth-style.css">
</head>
<body>

<div class="auth-card">
  <a href="index.html" class="back-home">← Terug naar de website</a>
  <div class="brand"><span class="brand-mark">HN</span> Hijrah Netwerk</div>

  <h1>Welkom terug</h1>
  <p class="lead">Log in om verder te gaan op je Hijrah Netwerk-dashboard.</p>

  <div class="msg" id="msg"></div>

  <form id="login-form">
    <div class="field">
      <label for="email">E-mailadres</label>
      <input type="email" id="email" required autocomplete="email" placeholder="jij@voorbeeld.com">
    </div>
    <div class="field">
      <label for="password">Wachtwoord</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary" id="submit-btn">Inloggen</button>
  </form>

  <div class="auth-links">
    <a href="reset-password.html">Wachtwoord vergeten?</a>
  </div>
  <div class="auth-links">
    Nog geen account? <a href="register.html">Account aanmaken</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script>
  const form = document.getElementById('login-form');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');

  // Als er al een geldige sessie is, meteen naar het dashboard sturen.
  (async () => {
    const { session } = await hnGetSession();
    if (session) window.location.href = 'dashboard.html';
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    msg.textContent = '';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Inloggen...';

    const { data, error } = await hnSignIn(email, password);

    submitBtn.disabled = false;
    submitBtn.textContent = 'Inloggen';

    if (error) {
      msg.className = 'msg error';
      msg.textContent = hnFriendlyError(error);
      return;
    }

    if (data && data.session) {
      window.location.href = 'dashboard.html';
    }
  });
</script>

</body>
</html>
