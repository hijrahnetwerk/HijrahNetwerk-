<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inloggen — Hijrah Netwerk</title>
  <link rel="stylesheet" href="auth-style.css">
</head>

<body>

  <div class="auth-page">

    <a href="/" class="back-link">← Terug naar de website</a>

    <div class="auth-card">

      <div class="auth-logo">
        <strong>HN</strong>
        <span>Hijrah Netwerk</span>
      </div>

      <h1>Welkom terug</h1>

      <p class="auth-intro">
        Log in op jouw Hijrah Netwerk-account.
      </p>

      <form id="login-form">

        <div class="form-group">
          <label for="email">E-mailadres</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Wachtwoord</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="auth-button">
          Inloggen
        </button>

        <p id="login-message" class="auth-message"></p>

      </form>

      <p class="auth-forgot">
        <a href="/reset-password.html">Wachtwoord vergeten?</a>
      </p>

      <p class="auth-switch">
        Nog geen account?
        <a href="/register.html">Account aanmaken</a>
      </p>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script type="module" src="assets/speed-insights-init.js"></script>
  <script type="module" src="assets/analytics-init.js"></script>

  <script>
    (async function () {
      const { data } = await hnGetSession();

      if (data && data.session) {
        window.location.href = "/dashboard.html";
      }
    })();

    const form = document.getElementById('login-form');
    const message = document.getElementById('login-message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      message.textContent = 'Bezig met inloggen...';
      message.className = 'auth-message';

      try {
        const { data, error } = await hnSignIn(email, password);

        if (error) {
          message.textContent =
            error.message || 'E-mailadres of wachtwoord is niet correct.';
          message.className = 'auth-message error';
          return;
        }

        if (data && data.session) {
          window.location.href = "/dashboard.html";
        } else {
          message.textContent =
            'Inloggen is gelukt, maar er kon geen sessie worden aangemaakt.';
          message.className = 'auth-message error';
        }

      } catch (err) {
        console.error(err);

        message.textContent =
          'Er ging iets mis. Probeer het opnieuw.';
        message.className = 'auth-message error';
      }
    });
  </script>

</body>
</html>
