name: HN Next.js Cloudflare build check

on:
  push:
    branches:
      - migration/nextjs-cloudflare
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: hn-build-check-anon-key
      HN_SITE_URL: https://hijrah-netwerk.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Next.js application
        run: npm run build

      - name: Build Cloudflare Worker output
        run: npm run cf:build
