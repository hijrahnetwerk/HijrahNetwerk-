name: HN preflight and build

on:
  pull_request:
    branches:
      - main
      - refactor/central-design-system-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run preflight checks
        env:
          VITE_SUPABASE_URL: https://dejmckimvstfjeickplx.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder_not_a_secret
          HN_SITE_URL: https://hijrah-netwerk.vercel.app
        run: npm test
      - name: Build static site
        env:
          VITE_SUPABASE_URL: https://dejmckimvstfjeickplx.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder_not_a_secret
          HN_SITE_URL: https://hijrah-netwerk.vercel.app
        run: npm run build
