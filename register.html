```html
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account aanmaken — Hijrah Netwerk</title>
  <link rel="stylesheet" href="auth-style.css">
</head>

<body>

  <div class="auth-page">

    <a href="/" class="back-link">← Terug naar de website</a>

    <div class="auth-card">

      <div class="auth-logo">
        <strong>HN</strong>
        <span>Hijrah Netwerk</span>
      </div>

      <h1>Maak je account aan</h1>

      <p class="auth-intro">
        Maak een account aan om toegang te krijgen tot jouw persoonlijke omgeving.
      </p>

      <form id="register-form">

        <div class="form-group">
          <label for="email">E-mailadres</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Wachtwoord</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" class="auth-button">
          Account aanmaken
        </button>

        <p id="register-message" class="auth-message"></p>

      </form>

      <p class="auth-switch">
        Al een account?
        <a href="/login.html">Inloggen</a>
      </p>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script type="module" src="assets/speed-insights-init.js"></script>

  <script>
    const form = document.getElementById('register-form');
    const message = document.getElementById('register-message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      message.textContent = 'Bezig met account aanmaken...';
      message.className = 'auth-message';

      try {
        const { data, error } = await hnSignUp(email, password);

        if (error) {
          message.textContent = error.message || 'Er ging iets mis bij het aanmaken van je account.';
          message.className = 'auth-message error';
          return;
        }

        message.textContent =
          'Account aangemaakt. Controleer eventueel je e-mail om je account te bevestigen.';
        message.className = 'auth-message success';

        form.reset();

      } catch (err) {
        console.error(err);

        message.textContent =
          'Er ging iets mis. Probeer het opnieuw.';
        message.className = 'auth-message error';
      }
    });
  </script>

</body>
</html>
```
