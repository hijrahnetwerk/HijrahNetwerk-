<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuw wachtwoord instellen — Hijrah Netwerk</title>
<link rel="stylesheet" href="assets/auth-style.css">
</head>
<body>

<div class="auth-card">
  <div class="brand">
    <span class="brand-mark">HN</span> Hijrah Netwerk
  </div>

  <h1>Nieuw wachtwoord instellen</h1>
  <p class="lead">Kies een nieuw wachtwoord voor je account.</p>

  <div class="msg" id="msg"></div>

  <form id="update-form">
    <div class="field">
      <label for="password">Nieuw wachtwoord</label>
      <input
        type="password"
        id="password"
        required
        minlength="6"
        autocomplete="new-password"
        placeholder="Minstens 6 tekens"
      >
    </div>

    <button
      type="submit"
      class="btn btn-primary"
      id="submit-btn"
      disabled
    >
      Even controleren...
    </button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="auth.js"></script>

<script>
  const form = document.getElementById('update-form');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');

  async function checkRecoverySession() {
    try {
      const { data, error } = await window.hijrahSupabase.auth.getSession();

      if (error) {
        throw error;
      }

      if (!data.session) {
        msg.className = 'msg error';
        msg.textContent =
          'Deze resetlink is verlopen of ongeldig. Vraag een nieuwe resetlink aan.';
        submitBtn.disabled = true;
        return;
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'Wachtwoord opslaan';

    } catch (error) {
      console.error('Recovery session error:', error);

      msg.className = 'msg error';
      msg.textContent =
        'De resetlink kon niet worden gecontroleerd. Vraag een nieuwe resetlink aan.';
      submitBtn.disabled = true;
    }
  }

  window.hijrahSupabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Wachtwoord opslaan';
      msg.className = 'msg';
      msg.textContent = '';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('password').value.trim();

    if (password.length < 6) {
      msg.className = 'msg error';
      msg.textContent = 'Je wachtwoord moet minstens 6 tekens lang zijn.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Bezig...';
    msg.className = 'msg';

    try {
      const { error } = await window.hijrahSupabase.auth.updateUser({
        password: password
      });

      if (error) {
        throw error;
      }

      msg.className = 'msg success';
      msg.textContent =
        'Wachtwoord bijgewerkt! Je wordt doorgestuurd naar het dashboard...';

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);

    } catch (error) {
      console.error('Password update error:', error);

      msg.className = 'msg error';
      msg.textContent =
        error.message || 'Er ging iets mis. Probeer het opnieuw.';

      submitBtn.disabled = false;
      submitBtn.textContent = 'Wachtwoord opslaan';
    }
  });

  checkRecoverySession();
</script>

</body>
</html>
