<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuw wachtwoord instellen — Hijrah Netwerk</title>
<link rel="stylesheet" href="assets/auth-style.css">
</head>
<body>

<div class="auth-card">
  <div class="brand"><span class="brand-mark">HN</span> Hijrah Netwerk</div>

  <h1>Nieuw wachtwoord instellen</h1>
  <p class="lead">Kies een nieuw wachtwoord voor je account.</p>

  <div class="msg" id="msg"></div>

  <form id="update-form">
    <div class="field">
      <label for="password">Nieuw wachtwoord</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="Minstens 6 tekens">
    </div>
    <button type="submit" class="btn btn-primary" id="submit-btn">Wachtwoord opslaan</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script type="module" src="assets/speed-insights-init.js"></script>
<script type="module" src="assets/analytics-init.js"></script>
<script>
  const form = document.getElementById('update-form');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');

  // Supabase zet de gebruiker automatisch in een tijdelijke sessie
  // wanneer ze via de e-mail-resetlink hier terechtkomen
  // (dankzij detectSessionInUrl: true in supabase-client.js).

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';

    const password = document.getElementById('password').value;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Bezig...';

    const { error } = await hnUpdatePassword(password);

    submitBtn.disabled = false;
    submitBtn.textContent = 'Wachtwoord opslaan';

    if (error) {
      msg.className = 'msg error';
      msg.textContent = hnFriendlyError(error);
      return;
    }

    msg.className = 'msg success';
    msg.textContent = 'Wachtwoord bijgewerkt! Je wordt doorgestuurd naar het dashboard...';
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
  });
</script>

</body>
</html>
