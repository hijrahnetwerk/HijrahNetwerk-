<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HN Communitylid | Hijrah Netwerk</title>
<link rel="stylesheet" href="assets/public-nav.css">
<style>
:root{--brown:#684a25;--brown-dark:#4d3819;--orange:#df842c;--gold:#e9a74b;--cream:#fbf8f4;--soft:#f5efe7;--line:#e3d8ca;--text:#302820;--muted:#756c61}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,sans-serif}.wrap{width:min(960px,calc(100% - 32px));margin:auto;padding:45px 0 70px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 14px 38px rgba(104,74,37,.05)}.loading{text-align:center;color:var(--muted);padding:70px 20px}.identity{display:flex;align-items:center;gap:16px}.avatar{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--brown);color:#fff;font-size:18px;font-weight:900}.name{font-size:24px;font-weight:800;color:var(--brown-dark)}.code{margin-top:4px;color:#9a8a79;font-size:11px}.role{display:inline-flex;margin-top:8px;padding:6px 9px;border-radius:999px;background:#eaf2eb;color:#4d7654;font-size:10px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:24px}.stat{padding:14px 8px;border-radius:13px;background:var(--soft);text-align:center}.stat strong{display:block;font-size:20px;color:var(--brown-dark)}.stat span{display:block;margin-top:4px;font-size:10px;color:var(--muted)}.section{margin-top:26px}.section h2{margin:0 0 14px;color:var(--brown-dark);font-size:17px}.stamps{display:flex;flex-wrap:wrap;gap:12px}.stamp{width:90px;min-height:100px;text-align:center}.stamp-circle{width:76px;height:76px;margin:auto;border:3px double rgba(111,63,38,.68);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#6f3f26;font-size:9px;font-weight:900;line-height:1.2;transform:rotate(-5deg);position:relative;background:rgba(111,63,38,.025)}.stamp:nth-child(2) .stamp-circle{transform:rotate(4deg)}.stamp:nth-child(3) .stamp-circle{transform:rotate(-2deg)}.stamp:nth-child(4) .stamp-circle{transform:rotate(5deg)}.stamp-circle:before{content:"";position:absolute;inset:6px;border:1px dashed rgba(111,63,38,.35);border-radius:50%}.stamp-name{margin-top:7px;font-size:10px;font-weight:800;color:var(--brown-dark)}.joined{margin-top:10px;font-size:11px;color:var(--muted)}.empty{padding:50px 20px;text-align:center;color:var(--muted)}@media(max-width:650px){.wrap{width:min(100% - 24px,960px);padding:28px 0 50px}.card{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.identity{align-items:flex-start}.avatar{width:58px;height:58px;flex-shrink:0}}
</style>
</head>
<body>
<script src="assets/public-nav.js"></script>
<main class="wrap">
  <div id="app" class="card loading">Profiel wordt geladen...</div>
</main>
<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
const app=document.getElementById('app');
const q=new URLSearchParams(location.search);
const code=q.get('code');

function esc(v){return v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}

async function init(){
  if(!code){
    app.innerHTML='<div class="empty">Geen openbaar HN-profiel gevonden.</div>';
    return;
  }

  const {data,error}=await window.hijrahSupabase.rpc('get_public_member_profile',{p_code:code});

  if(error||!data){
    console.error(error);
    app.innerHTML='<div class="empty">Dit communityprofiel bestaat niet of is niet openbaar.</div>';
    return;
  }

  const stamps=data.stamps||[];

  app.classList.remove('loading');
  app.innerHTML=
    '<div class="identity">'+
      '<div class="avatar">HN</div>'+
      '<div>'+
        '<div class="name">'+esc(data.public_name)+'</div>'+
        '<div class="code">'+esc(data.public_code)+' · jouw HN-refercode</div>'+
        '<span class="role">'+esc(data.community_role||'Communitylid')+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="joined">Lid sinds '+esc(data.joined_year||'')+'</div>'+
    '<div class="stats">'+
      '<div class="stat"><strong>'+Number(data.reviews_count||0)+'</strong><span>Reviews</span></div>'+
      '<div class="stat"><strong>'+Number(data.experiences_count||0)+'</strong><span>Ervaringen</span></div>'+
      '<div class="stat"><strong>'+Number(data.approved_contributions_count||0)+'</strong><span>Bijdragen</span></div>'+
      '<div class="stat"><strong>'+Number(data.referrals_count||0)+'</strong><span>Referrals</span></div>'+
      '<div class="stat"><strong>'+stamps.length+'</strong><span>Stempels</span></div>'+
    '</div>'+
    '<div class="section"><h2>Behaalde HN-stempels</h2>'+
      (stamps.length
        ? '<div class="stamps">'+stamps.map((s,i)=>
            '<div class="stamp"><div class="stamp-circle">'+String(i+1).padStart(2,'0')+'<br>'+esc(s.name)+'</div><div class="stamp-name">'+esc(s.name)+'</div></div>'
          ).join('')+'</div>'
        : '<div class="joined">Nog geen behaalde stempels.</div>'
      )+
    '</div>';
}

init();
</script>
</body>
</html>
