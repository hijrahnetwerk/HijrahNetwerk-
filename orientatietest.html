<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hijrah Oriëntatietest — Hijrah Netwerk</title>
<meta name="description" content="Een praktische oriëntatietest om je eigen prioriteiten voor je hijrah helder te krijgen.">
<link rel="stylesheet" href="assets/platform-pages.css">
<style>
.test{max-width:760px;margin:auto}.q{display:none}.q.active{display:block}.options{display:grid;gap:10px;margin-top:18px}.opt{padding:16px;border:1px solid var(--border);border-radius:12px;background:#fff;cursor:pointer}.opt.selected{border-color:var(--orange);background:#fff7ee}.progress{height:7px;background:#eee5db;border-radius:20px;overflow:hidden;margin:18px 0 28px}.bar{height:100%;background:var(--orange);width:0}.result{display:none}.result.show{display:block}

/* ── HN DESIGN SYSTEM UPGRADE ── */
:root{
  --gd2:#D4AF37;--gd3:#F0D060;
  --bg:#FDFAF6;--border-gd:rgba(212,175,55,.35);
  --shadow-gd:0 14px 38px rgba(212,175,55,.22);
}
/* Goud stripe */
.hn-stripe{
  height:3px;
  background:linear-gradient(90deg,#674C2E,#DD842A,#D4AF37,#F0D060,#D4AF37,#DD842A,#674C2E);
  background-size:300% 100%;
  animation:hn-stripe 5s linear infinite;
}
@keyframes hn-stripe{to{background-position:300% 0}}
/* Gold divider */
.hn-divider{
  height:2px;border:none;
  background:linear-gradient(90deg,transparent,#C6A15B,#D4AF37,#C6A15B,transparent);
  opacity:.55;margin:0;
}
/* Hero gradient upgrade */
.hero{
  background:
    radial-gradient(ellipse at 88% 8%,rgba(212,175,55,.35),transparent 46%),
    radial-gradient(ellipse at 8% 90%,rgba(221,132,42,.22),transparent 40%),
    linear-gradient(148deg,#3d2a14 0%,#674C2E 38%,#7a4e28 65%,#4e3018 100%)!important;
}
/* Kaarten gold-top accent */
.card.hn-card-gold,
.panel.hn-card-gold{border-top:3px solid #D4AF37}
/* Animaties */
.hn-reveal{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.22,.61,.36,1),transform .6s cubic-bezier(.22,.61,.36,1)}
.hn-reveal.hn-in{opacity:1;transform:none}
.hn-d1{transition-delay:.08s}.hn-d2{transition-delay:.16s}.hn-d3{transition-delay:.24s}.hn-d4{transition-delay:.32s}
/* Btn upgrade */
.btn-primary,.button-primary,.hnbtn.primary{
  background:linear-gradient(135deg,#DD842A,#C6A15B)!important;
  box-shadow:0 8px 24px rgba(212,175,55,.25)!important;
}
/* Tab active upgrade */
.tab.active{
  background:linear-gradient(135deg,#674C2E,#DD842A)!important;
  color:#fff!important;
  border-color:transparent!important;
  box-shadow:0 5px 16px rgba(103,76,46,.22)!important;
}
/* Filter input focus */
.filter input:focus,.filter select:focus,
input:focus,select:focus,textarea:focus{
  border-color:#C6A15B!important;
  box-shadow:0 0 0 3px rgba(212,175,55,.15)!important;
}
/* Gold badge */
.hn-badge-gd{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 11px;border-radius:999px;
  font-size:11px;font-weight:800;
  background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(103,76,46,.08));
  color:#D4AF37;border:1px solid rgba(212,175,55,.35);
}
/* Dashboard hero upgrade */
.hero{position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;
  width:380px;height:380px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;right:-140px;bottom:-200px;
  box-shadow:0 0 0 40px rgba(255,255,255,.04),0 0 0 80px rgba(255,255,255,.025);
  pointer-events:none;
}
/* Dots patroon achtergrond */
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:radial-gradient(circle,rgba(103,76,46,.03) 1px,transparent 1px);
  background-size:32px 32px;
  pointer-events:none;
  z-index:-1;
}

</style>

<link rel="stylesheet" href="/assets/hn-sitewide.css?v=1">
<script src="/assets/hn-motion.js?v=1" defer></script>
</head>
<body>
<div class="hn-stripe" style="height:3px;background:linear-gradient(90deg,#674C2E,#DD842A,#D4AF37,#F0D060,#D4AF37,#DD842A,#674C2E);background-size:300% 100%;animation:hn-stripe 5s linear infinite"></div>
<link rel="stylesheet" href="assets/public-nav.css">
<script src="assets/public-nav.js"></script>
<script src="/config.js"></script>
  <script src="supabase-client.js"></script>

<main class="hero"><div class="container hero-inner"><span class="eyebrow">Hijrah Oriëntatietest</span><h1>Wat is voor jou echt belangrijk?</h1><p>Beantwoord een paar vragen. De test geeft je geen landadvies, maar helpt je eigen prioriteiten zichtbaar te maken.</p></div></main>

<section class="section">
<div class="container test">
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="questions"></div>
<div id="result" class="result card" style="padding:26px;margin-top:20px">
<h2>Jouw oriëntatie</h2>
<p id="resultText" style="color:var(--muted);margin:10px 0 18px"></p>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<a class="button primary" href="/landen">Bekijk landen & steden</a>
<a class="button secondary" href="/vergelijken">Vergelijk steden</a>
<a class="button secondary" href="/realiteitscheck">Doe de realiteitscheck</a>
</div>
</div>
</div>
</section>

<script>
const qs=[
['Wat wil je vooral beschermen of opbouwen?',['Rust en stabiliteit','Geloof en omgeving','Gezin en kinderen','Financiële ruimte']],
['Wat weegt het zwaarst bij een stad?',['Betaalbare huisvesting','Onderwijs','Actief moslimleven','Werk en inkomen']],
['Hoe belangrijk is toegang tot praktische voorzieningen?',['Heel belangrijk','Belangrijk','Redelijk belangrijk','Minder belangrijk']],
['Hoeveel onderzoek heb je al gedaan?',['Ik begin net','Ik heb meerdere landen bekeken','Ik heb steden vergeleken','Ik ben al concreet aan het voorbereiden']],
['Wat wil je nu vooral weten?',['Hoe het dagelijks leven is','Wat praktisch geregeld moet worden','Welke stad bij mij past','Wat ik vóór vertrek moet doen']]
];
let step=0,answers=JSON.parse(localStorage.getItem('hn_orientation_test')||'[]');
const box=document.getElementById('questions');
function render(){
 box.innerHTML=qs.map((q,i)=>'<div class="q '+(i===step?'active':'')+'" data-q="'+i+'"><span class="eyebrow">Vraag '+(i+1)+' van '+qs.length+'</span><h2 style="margin-top:12px">'+q[0]+'</h2><div class="options">'+q[1].map((o,j)=>'<button type="button" class="opt '+(answers[i]===j?'selected':'')+'" data-j="'+j+'">'+o+'</button>').join('')+'</div></div>').join('');
 box.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{answers[step]=Number(b.dataset.j);localStorage.setItem('hn_orientation_test',JSON.stringify(answers));if(step<qs.length-1){step++;render()}else{showResult()}}));
 document.getElementById('bar').style.width=((step+1)/qs.length*100)+'%';
}
async function saveOrientation(){
 try{const db=window.hijrahSupabase;if(!db)return;const {data}=await db.auth.getUser();if(!data?.user)return;const payload={user_id:data.user.id,orientation_answers:Object.fromEntries(answers.map((a,i)=>[String(i),qs[i][1][a]||null])),priorities:answers.map((a,i)=>qs[i][1][a]).filter(Boolean),onboarding_completed:true,updated_at:new Date().toISOString()};await db.from('member_preferences').upsert(payload,{onConflict:'user_id'});}catch(e){console.warn('HN oriëntatie opslaan',e)}
}
function showResult(){
 const labels=answers.map((a,i)=>qs[i][1][a]).filter(Boolean);
 document.getElementById('resultText').textContent='Je belangrijkste antwoorden: '+labels.join(' · ')+'. Gebruik dit als uitgangspunt voor je verdere onderzoek. HN bepaalt op basis hiervan niet welk land je moet kiezen.';
 document.getElementById('result').classList.add('show');saveOrientation();
 document.querySelectorAll('.q').forEach(x=>x.classList.remove('active'));
 document.getElementById('bar').style.width='100%';
}
render();
if(answers.length===qs.length)showResult();
</script>
<script src="/assets/hn-footer.js" defer></script>
</body>
</html>
